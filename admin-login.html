<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — The Way (দ্য ওয়ে) Editorial HQ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@600;700&family=Inter:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --crimson:   #c2182b;
      --crimson-d: #8b0e1b;
      --gold:      #d97706;
      --bg:        #090d14;
      --card-bg:   #121722;
      --text:      #f3f4f6;
      --muted:     #9ca3af;
      --border:    rgba(255,255,255,0.1);
      --shadow:    0 25px 60px rgba(0,0,0,0.6);
    }

    html, body { height: 100%; font-family: 'Inter', 'Hind Siliguri', sans-serif; }

    body {
      background: radial-gradient(circle at center, #161c28 0%, var(--bg) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: var(--text);
      padding: 1.5rem;
      position: relative;
    }

    .login-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(194, 24, 43, 0.35);
      position: relative;
      z-index: 1;
      text-align: center;
      animation: slideUp .4s cubic-bezier(.16,1,.3,1);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .login-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }

    .login-heading {
      font-family: 'Playfair Display', 'Noto Serif Bengali', serif;
      font-size: 24px;
      color: #fff;
      margin-bottom: 6px;
    }

    .login-sub {
      font-size: 13.5px;
      color: var(--muted);
      margin-bottom: 28px;
      line-height: 1.6;
    }

    .google-btn-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
      min-height: 44px;
    }

    .msg-box {
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 13px;
      margin-bottom: 18px;
      line-height: 1.5;
      display: none;
      text-align: left;
    }
    .msg-box.visible { display: block; }
    .msg-box.error { background: #3b0d11; border: 1px solid #7f1d1d; color: #fca5a5; }
    .msg-box.info  { background: #0f2438; border: 1px solid #1e4976; color: #93c5fd; }

    .spinner {
      display: none;
      width: 22px; height: 22px;
      border: 2.5px solid rgba(194,24,43,.2);
      border-top-color: var(--crimson);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 12px auto;
    }
    .spinner.visible { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .login-notice {
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.6;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <div class="login-card">

    <div class="login-logo">
      <img src="assets/images/logo.svg" alt="The Way (দ্য ওয়ে)" style="height:52px;" onerror="this.src='logo.svg'">
    </div>

    <h1 class="login-heading">Editorial & Movement HQ</h1>
    <p class="login-sub">Authorized portal for The Way editorial collective and movement coordinators.</p>

    <div id="msg-box" class="msg-box"></div>
    <div id="spinner" class="spinner"></div>

    <div class="google-btn-wrap">
      <div id="g_id_onload"
           data-client_id="969711915910-n5bdco306c592hmssev3ns9efn53fnoo.apps.googleusercontent.com"
           data-callback="handleCredentialResponse"
           data-auto_prompt="false">
      </div>
      <div class="g_id_signin"
           data-type="standard"
           data-size="large"
           data-theme="filled_black"
           data-text="sign_in_with"
           data-shape="rectangular"
           data-logo_alignment="left"
           data-width="320">
      </div>
    </div>

    <p class="login-notice">
      Access restricted to authenticated editorial collective members.
    </p>
  </div>

  <script>
    const TOKEN_KEY = 'theway_token';

    // If already logged in, redirect directly
    (async function () {
      const token = localStorage.getItem(TOKEN_KEY) || localStorage.getItem('privatian_token');
      if (!token) return;
      try {
        const r = await fetch('/api/auth?action=me', { headers: { 'Authorization': 'Bearer ' + token } });
        if (r.ok) { window.location.replace('/admin.html'); }
      } catch(e) {}
    })();

    const loginMsg = sessionStorage.getItem('login_message');
    if (loginMsg) {
      showMsg('info', loginMsg);
      sessionStorage.removeItem('login_message');
    }

    function showMsg(type, text) {
      const box = document.getElementById('msg-box');
      box.className = 'msg-box visible ' + type;
      box.textContent = text;
    }

    function setLoading(on) {
      document.getElementById('spinner').className = 'spinner' + (on ? ' visible' : '');
    }

    async function handleCredentialResponse(response) {
      setLoading(true);
      showMsg('info', 'Verifying your credentials...');

      try {
        const res = await fetch('/api/auth?action=verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ credential: response.credential })
        });

        const data = await res.json();
        setLoading(false);

        if (data.success && data.token) {
          localStorage.setItem(TOKEN_KEY, data.token);
          localStorage.setItem('privatian_token', data.token); // dual support
          showMsg('info', 'Access granted! Redirecting to Editorial HQ...');
          setTimeout(function() { window.location.replace('/admin.html'); }, 600);
        } else {
          showMsg('error', data.error || 'Authentication failed. Please check your credentials.');
        }

      } catch(e) {
        setLoading(false);
        showMsg('error', 'Network error. Please try again.');
      }
    }
  </script>
</body>
</html>
