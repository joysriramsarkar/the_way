<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <!-- Anti-Cache Meta Tags to prevent stale mobile/browser caching -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <script>
    (function() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) regs[i].unregister();
        });
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
  <link rel="alternate icon" type="image/svg+xml" href="favicon.svg" />
  <title>লগইন — দ্য ওয়ে (The Way)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --crimson:      #c2182b;
      --crimson-glow: rgba(194, 24, 43, 0.35);
      --crimson-dark: #8b0e1b;
      --gold:         #d97706;
      --bg:           #090d14;
      --card-bg:      rgba(18, 23, 34, 0.9);
      --input-bg:     #0d121c;
      --text:         #f3f4f6;
      --text-muted:   #9ca3af;
      --border:       rgba(255, 255, 255, 0.1);
      --shadow:       0 25px 60px rgba(0, 0, 0, 0.75);
    }

    html, body {
      height: 100%;
      font-family: 'Hind Siliguri', 'Inter', sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #161d2b 0%, var(--bg) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: var(--text);
      padding: 1.5rem;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      width: 460px;
      height: 460px;
      background: radial-gradient(circle, var(--crimson-glow) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      filter: blur(60px);
      opacity: 0.5;
    }

    .login-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 44px 38px;
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow), 0 0 0 1px rgba(194, 24, 43, 0.25);
      position: relative;
      z-index: 1;
      animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .login-header {
      text-align: center;
      margin-bottom: 26px;
    }

    .login-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      text-decoration: none;
    }

    .login-heading {
      font-size: 23px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 5px;
    }

    .login-sub {
      font-size: 13.5px;
      color: var(--text-muted);
    }

    .msg-box {
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13px;
      margin-bottom: 18px;
      line-height: 1.5;
      display: none;
      text-align: left;
    }
    .msg-box.visible { display: flex; align-items: center; gap: 8px; }
    .msg-box.error { background: rgba(127, 29, 29, 0.4); border: 1px solid #991b1b; color: #fca5a5; }
    .msg-box.success { background: rgba(6, 78, 59, 0.4); border: 1px solid #065f46; color: #6ee7b7; }
    .msg-box.info { background: rgba(30, 58, 138, 0.4); border: 1px solid #1e40af; color: #93c5fd; }

    .form-group {
      margin-bottom: 18px;
      text-align: left;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #e5e7eb;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: var(--text-muted);
      font-size: 16px;
      pointer-events: none;
      user-select: none;
    }

    .form-input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px 12px 42px;
      font-family: inherit;
      font-size: 14px;
      color: #fff;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      border-color: var(--crimson);
      box-shadow: 0 0 0 3px var(--crimson-glow);
      background: #111827;
    }

    .form-input::placeholder {
      color: #6b7280;
    }

    .toggle-pw-btn {
      position: absolute;
      right: 12px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
      border-radius: 6px;
    }
    .toggle-pw-btn:hover {
      color: #fff;
    }

    .form-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-size: 12.5px;
      color: var(--text-muted);
    }

    .remember-wrap {
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      user-select: none;
    }
    .remember-wrap input[type="checkbox"] {
      accent-color: var(--crimson);
      width: 15px;
      height: 15px;
      cursor: pointer;
    }

    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--crimson) 0%, var(--crimson-dark) 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 13px 20px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 15px var(--crimson-glow);
      transition: all 0.25s ease;
    }

    .submit-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(194, 24, 43, 0.6);
      filter: brightness(1.08);
    }

    .submit-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .btn-spinner {
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    .btn-spinner.visible { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .auth-links {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .auth-links a {
      color: #93c5fd;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }
    .auth-links a:hover {
      color: #bfdbfe;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-card">

    <div class="login-header">
      <a href="/" class="login-logo" title="দ্য ওয়ে মূলপাতা">
        <img loading="lazy" src="assets/images/logo.svg" alt="The Way (দ্য ওয়ে)" style="height:48px;" onerror="this.src='logo.svg'" />
      </a>
      <h1 class="login-heading">প্রবেশদ্বার</h1>
      <p class="login-sub">দ্য ওয়ে (The Way) — সম্পাদকীয় ও লেখক পরিষদ</p>
    </div>

    <!-- Alert Message Box -->
    <div id="msg-box" class="msg-box" role="alert"></div>

    <!-- Clean Email & Password Form (No hardcoded credentials) -->
    <form id="login-form" autocomplete="on">
      <div class="form-group">
        <label for="email" class="form-label">ইমেইল অ্যাড্রেস</label>
        <div class="input-wrapper">
          <span class="input-icon">✉️</span>
          <input
            type="email"
            id="email"
            class="form-input"
            placeholder="আপনার নিবন্ধিত ইমেইল লিখুন"
            required
            autocomplete="email"
            autofocus
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">পাসওয়ার্ড</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input
            type="password"
            id="password"
            class="form-input"
            placeholder="আপনার পাসওয়ার্ড লিখুন"
            required
            autocomplete="current-password"
          />
          <button type="button" class="toggle-pw-btn" id="toggle-pw" title="পাসওয়ার্ড দেখুন/লুকান">👁️</button>
        </div>
      </div>

      <div class="form-row">
        <label class="remember-wrap">
          <input type="checkbox" id="remember-me" checked />
          <span>আমাকে মনে রাখুন</span>
        </label>
        <span style="font-size:11.5px; color:var(--text-muted);">নিরাপদ এনক্রিপশন</span>
      </div>

      <button type="submit" class="submit-btn" id="submit-btn">
        <span class="btn-spinner" id="btn-spinner"></span>
        <span id="btn-text">লগইন করুন ➔</span>
      </button>
    </form>

    <div class="auth-links">
      <div>
        নতুন অ্যাকাউন্ট প্রয়োজন?
        <a href="/register.html">এখানে নিবন্ধন করুন</a>
      </div>
      <div>
        <a href="/" style="color:var(--text-muted); font-size:12px;">← মূল পোর্টাল ও পত্রিকায় ফিরে যান</a>
      </div>
    </div>

  </div>

  <script>
    const TOKEN_KEY = 'theway_token';
    const msgBox = document.getElementById('msg-box');
    const submitBtn = document.getElementById('submit-btn');
    const btnSpinner = document.getElementById('btn-spinner');
    const btnText = document.getElementById('btn-text');
    const togglePwBtn = document.getElementById('toggle-pw');
    const passwordInput = document.getElementById('password');
    const emailInput = document.getElementById('email');

    // Auto-redirect if already logged in
    (async function checkExistingAuth() {
      const token = localStorage.getItem(TOKEN_KEY) || localStorage.getItem('theway_token');
      if (!token) return;
      try {
        const res = await fetch('/api/auth?action=me', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        if (res.ok) {
          const data = await res.json();
          if (data.user && ['Admin', 'Moderator', 'Editor'].includes(data.user.role)) {
            window.location.replace('/admin.html');
          } else {
            window.location.replace('/submit-article.html');
          }
        }
      } catch (e) {}
    })();

    const sessionMsg = sessionStorage.getItem('login_message');
    if (sessionMsg) {
      showMsg('info', sessionMsg);
      sessionStorage.removeItem('login_message');
    }

    togglePwBtn.addEventListener('click', function () {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      togglePwBtn.textContent = isPassword ? '🙈' : '👁️';
    });

    function showMsg(type, text) {
      msgBox.className = 'msg-box visible ' + type;
      msgBox.innerHTML = `<span>${text}</span>`;
    }

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      btnSpinner.className = 'btn-spinner' + (isLoading ? ' visible' : '');
      btnText.textContent = isLoading ? 'যাচাই করা হচ্ছে...' : 'লগইন করুন ➔';
    }

    document.getElementById('login-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showMsg('error', 'দয়া করে ইমেইল এবং পাসওয়ার্ড উভয়ই প্রদান করুন।');
        return;
      }

      setLoading(true);

      try {
        const res = await fetch('/api/auth?action=login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();
        setLoading(false);

        if (res.ok && data.success && data.token) {
          localStorage.setItem(TOKEN_KEY, data.token);
          localStorage.setItem('theway_token', data.token);

          showMsg('success', 'স্বাগতম! সফলভাবে লগইন হয়েছে। প্রবেশ করা হচ্ছে...');
          setTimeout(function () {
            if (data.user && ['Admin', 'Moderator', 'Editor'].includes(data.user.role)) {
              window.location.replace('/admin.html');
            } else {
              window.location.replace('/submit-article.html');
            }
          }, 400);
        } else {
          showMsg('error', data.error || 'লগইন ব্যর্থ হয়েছে। সঠিক ইমেইল ও পাসওয়ার্ড প্রদান করুন।');
        }
      } catch (err) {
        setLoading(false);
        showMsg('error', 'সার্ভারের সাথে সংযোগ করা যায়নি। আবার চেষ্টা করুন।');
      }
    });
  </script>
</body>
</html>
