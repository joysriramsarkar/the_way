<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
  <title>বৈশ্বিক ফিড — দ্য ওয়ে</title>
  <meta name="description" content="The Way Global Feed — Follow socialist discussions, debates and ideas from activists, researchers and writers worldwide.">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/network.css">
</head>
<body id="top">

  <div id="theway-ticker-mount" class="theway-ticker-bar"></div>
  <header id="theway-header-mount" class="theway-header"></header>

  <main class="container" style="padding-top:2rem; padding-bottom:4rem;">

    <div style="display:grid; grid-template-columns:1fr min(680px,100%) 1fr; gap:1.5rem; align-items:start;">

      <!-- Left Sidebar (hidden on mobile) -->
      <aside style="position:sticky; top:80px;" class="feed-sidebar-left">
        <div style="background:linear-gradient(145deg,rgba(18,7,7,0.9),rgba(12,4,4,0.95)); border:1px solid rgba(255,255,255,0.08); border-radius:12px; padding:1.25rem; margin-bottom:1rem;">
          <h3 style="font-size:0.8rem; font-weight:700; color:rgba(255,255,255,0.5); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:1rem;">ফিল্টার</h3>
          <div style="display:flex; flex-direction:column; gap:0.4rem;">
            <button class="feed-filter-btn active" onclick="setFeedFilter('all', this)">🌍 সব পোস্ট</button>
            <button class="feed-filter-btn" onclick="setFeedFilter('following', this)">👥 অনুসরণকৃত</button>
            <button class="feed-filter-btn" onclick="setFeedFilter('groups', this)">📚 গ্রুপ</button>
            <button class="feed-filter-btn" onclick="setFeedFilter('debate', this)">💬 বিতর্ক</button>
            <button class="feed-filter-btn" onclick="setFeedFilter('question', this)">❓ প্রশ্ন</button>
            <button class="feed-filter-btn" onclick="setFeedFilter('solidarity', this)">✊ সংহতি</button>
          </div>
        </div>
        <div style="background:linear-gradient(145deg,rgba(18,7,7,0.9),rgba(12,4,4,0.95)); border:1px solid rgba(255,255,255,0.08); border-radius:12px; padding:1.25rem;">
          <h3 style="font-size:0.8rem; font-weight:700; color:rgba(255,255,255,0.5); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:1rem;">ভাষা</h3>
          <div style="display:flex; flex-wrap:wrap; gap:0.35rem;">
            <button class="filter-chip active" onclick="setLangFeedFilter('all', this)" style="font-size:0.72rem; padding:0.3rem 0.65rem;">সব</button>
            <button class="filter-chip" onclick="setLangFeedFilter('bn', this)" style="font-size:0.72rem; padding:0.3rem 0.65rem;">বাংলা</button>
            <button class="filter-chip" onclick="setLangFeedFilter('en', this)" style="font-size:0.72rem; padding:0.3rem 0.65rem;">EN</button>
            <button class="filter-chip" onclick="setLangFeedFilter('es', this)" style="font-size:0.72rem; padding:0.3rem 0.65rem;">ES</button>
            <button class="filter-chip" onclick="setLangFeedFilter('pt', this)" style="font-size:0.72rem; padding:0.3rem 0.65rem;">PT</button>
            <button class="filter-chip" onclick="setLangFeedFilter('ar', this)" style="font-size:0.72rem; padding:0.3rem 0.65rem;">AR</button>
            <button class="filter-chip" onclick="setLangFeedFilter('fr', this)" style="font-size:0.72rem; padding:0.3rem 0.65rem;">FR</button>
          </div>
        </div>
      </aside>

      <!-- Main Feed -->
      <div>
        <h1 style="font-size:1.4rem; font-weight:800; color:#fff; margin-bottom:1.5rem; display:flex; align-items:center; gap:0.5rem;">
          🌍 <span data-i18n="section.global_feed">বৈশ্বিক ফিড</span>
        </h1>

        <!-- Composer -->
        <div class="feed-composer">
          <div class="feed-composer-row">
            <div class="feed-composer-avatar">আ</div>
            <textarea class="feed-composer-input" id="new-post-input" placeholder="আপনার চিন্তা শেয়ার করুন..." rows="3" data-i18n-placeholder="feed.write_something"></textarea>
          </div>
          <div style="display:flex; justify-content:space-between; align-items:center; margin-top:0.75rem; padding-top:0.75rem; border-top:1px solid rgba(255,255,255,0.06);">
            <div style="display:flex; gap:0.5rem;">
              <button style="background:transparent; border:none; color:rgba(255,255,255,0.4); cursor:pointer; font-size:0.8rem; padding:0.3rem 0.6rem; border-radius:5px; font-family:inherit;" onclick="setPostType('post')">📝 পোস্ট</button>
              <button style="background:transparent; border:none; color:rgba(255,255,255,0.4); cursor:pointer; font-size:0.8rem; padding:0.3rem 0.6rem; border-radius:5px; font-family:inherit;" onclick="setPostType('question')">❓ প্রশ্ন</button>
              <button style="background:transparent; border:none; color:rgba(255,255,255,0.4); cursor:pointer; font-size:0.8rem; padding:0.3rem 0.6rem; border-radius:5px; font-family:inherit;" onclick="setPostType('debate')">💬 বিতর্ক</button>
            </div>
            <button class="btn-solid-crimson" style="padding:0.4rem 1rem; font-size:0.82rem;" onclick="submitPost()">পোস্ট করুন</button>
          </div>
        </div>

        <!-- Feed Posts -->
        <div id="feed-posts">
          <!-- Rendered by JS -->
        </div>

        <div style="text-align:center; padding:2rem;">
          <button style="background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); color:rgba(255,255,255,0.5); padding:0.6rem 1.5rem; border-radius:8px; font-family:inherit; font-size:0.85rem; cursor:pointer;" onclick="loadMorePosts()">আরও লোড করুন</button>
        </div>
      </div>

      <!-- Right Sidebar -->
      <aside style="position:sticky; top:80px;">
        <div style="background:linear-gradient(145deg,rgba(18,7,7,0.9),rgba(12,4,4,0.95)); border:1px solid rgba(255,255,255,0.08); border-radius:12px; padding:1.25rem; margin-bottom:1rem;">
          <h3 style="font-size:0.8rem; font-weight:700; color:rgba(255,255,255,0.5); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:1rem;">🔥 আজকের প্রশ্ন</h3>
          <div style="font-size:0.88rem; color:rgba(255,255,255,0.8); line-height:1.55; padding:0.75rem; background:rgba(196,18,48,0.08); border:1px solid rgba(196,18,48,0.2); border-radius:8px; margin-bottom:0.75rem;">
            "রাষ্ট্রের ভূমিকা নিয়ে মার্ক্সবাদী ঐতিহ্যের মধ্যে কী কী মতপার্থক্য রয়েছে?"
          </div>
          <button class="btn-follow" style="width:100%;">আলোচনায় যোগ দিন</button>
        </div>

        <div style="background:linear-gradient(145deg,rgba(18,7,7,0.9),rgba(12,4,4,0.95)); border:1px solid rgba(255,255,255,0.08); border-radius:12px; padding:1.25rem; margin-bottom:1rem;">
          <h3 style="font-size:0.8rem; font-weight:700; color:rgba(255,255,255,0.5); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:1rem;">👥 আপনার মতো মানুষ</h3>
          <div id="suggested-people" style="display:flex; flex-direction:column; gap:0.75rem;">
            <!-- Suggested profiles -->
          </div>
          <a href="directory.html" style="display:block; text-align:center; margin-top:0.75rem; font-size:0.78rem; color:var(--crimson-primary,#c41230); text-decoration:none;">সবাইকে দেখুন →</a>
        </div>

        <div style="background:linear-gradient(145deg,rgba(18,7,7,0.9),rgba(12,4,4,0.95)); border:1px solid rgba(255,255,255,0.08); border-radius:12px; padding:1.25rem;">
          <h3 style="font-size:0.8rem; font-weight:700; color:rgba(255,255,255,0.5); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:1rem;">📅 আসন্ন অনুষ্ঠান</h3>
          <div id="sidebar-events" style="display:flex; flex-direction:column; gap:0.6rem;"></div>
          <a href="events.html" style="display:block; text-align:center; margin-top:0.75rem; font-size:0.78rem; color:var(--crimson-primary,#c41230); text-decoration:none;">সব অনুষ্ঠান →</a>
        </div>
      </aside>
    </div>

  </main>

  <footer id="theway-footer-mount" class="theway-footer"></footer>

  <style>
    .feed-filter-btn {
      display:block; width:100%; text-align:start; padding:0.45rem 0.75rem;
      background:transparent; border:none; color:rgba(255,255,255,0.55);
      font-size:0.82rem; cursor:pointer; border-radius:7px; transition:all 0.15s;
      font-family:inherit;
    }
    .feed-filter-btn:hover { background:rgba(255,255,255,0.06); color:#fff; }
    .feed-filter-btn.active { background:rgba(196,18,48,0.15); color:#fff; font-weight:600; }
    .feed-sidebar-left, aside:last-child { display:none; }
    @media (min-width:1024px) { .feed-sidebar-left, aside:last-child { display:block; } }
    @media (min-width:768px) and (max-width:1023px) { 
      main > div { grid-template-columns: 1fr !important; }
      .feed-sidebar-left, aside:last-child { display:none; }
    }
  </style>

  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/script.js"></script>
  <script>
    let currentFilter = 'all';
    let currentLangFilter = 'all';
    let currentPostType = 'post';
    let livePosts = [];

    function setPostType(type) {
      currentPostType = type;
      const typeLabels = { post: '📝 পোস্ট', question: '❓ প্রশ্ন', debate: '💬 বিতর্ক' };
      const input = document.getElementById('new-post-input');
      if (type === 'question') {
        input.placeholder = 'আপনার তাত্ত্বিক বা মাঠপর্যায়ের প্রশ্নটি লিখুন...';
      } else if (type === 'debate') {
        input.placeholder = 'বিতর্কের মূল বিষয় ও আপনার অবস্থান উল্লেখ করুন...';
      } else {
        input.placeholder = 'আপনার চিন্তা বা বিশ্লেষণ শেয়ার করুন...';
      }
    }

    function setFeedFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.feed-filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      fetchFeed();
    }

    function setLangFeedFilter(lang, btn) {
      currentLangFilter = lang;
      document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      fetchFeed();
    }

    async function fetchFeed() {
      const container = document.getElementById('feed-posts');
      try {
        const res = await fetch(`/api/network?action=posts&filter=${currentFilter}&lang=${currentLangFilter}`);
        const data = await res.json();
        livePosts = data.posts || [];
        renderFeed();
      } catch (err) {
        console.error('Error fetching feed:', err);
        container.innerHTML = '<div style="text-align:center; padding:3rem; color:rgba(255,255,255,0.4);">ফিড লোড করতে ত্রুটি হয়েছে।</div>';
      }
    }

    function renderFeed() {
      const container = document.getElementById('feed-posts');
      if (!livePosts.length) {
        container.innerHTML = '<div style="text-align:center; padding:3rem; color:rgba(255,255,255,0.35);">এই ফিল্টারে কোনো পোস্ট নেই। নতুন পোস্ট লিখে শুরু করুন!</div>';
        return;
      }

      container.innerHTML = livePosts.map(p => {
        const typeColors = { debate: '#e8b84b', question: '#7dd3fc', solidarity_request: '#f87171', post: 'rgba(255,255,255,0.35)' };
        const typeLabels = { debate: '💬 বিতর্ক', question: '❓ প্রশ্ন', solidarity_request: '✊ সংহতি অনুরোধ', post: '' };
        const solidarityCount = (p.reactions && p.reactions.solidarity) || 0;
        const comments = p.comments || [];

        return `
        <div class="feed-post" data-post-id="${p.id}">
          <div class="feed-post-header">
            <div class="feed-post-avatar">${p.initials || 'TW'}</div>
            <div class="feed-post-meta">
              <div class="feed-post-author">
                ${p.author}
                <span style="font-size:0.75rem; color:rgba(255,255,255,0.35);">${p.country_flag || '🌍'} ${p.country || ''}</span>
              </div>
              <div class="feed-post-author-sub">
                <span class="lang-flag">${(p.lang || 'BN').toUpperCase()}</span>
                <span>${p.created_at ? new Date(p.created_at).toLocaleDateString() : 'সম্প্রতি'}</span>
                ${typeLabels[p.post_type] ? `<span style="color:${typeColors[p.post_type]}; font-weight:600;">${typeLabels[p.post_type]}</span>` : ''}
              </div>
            </div>
          </div>
          <div class="feed-post-content" style="white-space:pre-line;">${p.content}</div>

          <div class="feed-post-footer">
            <button class="feed-action-btn" onclick="reactPost('${p.id}', this)" title="সংহতি প্রকাশ করুন">
              ✊ <span class="react-count">${solidarityCount}</span> সংহতি
            </button>
            <button class="feed-action-btn" onclick="toggleCommentBox('${p.id}')">
              💬 <span>${comments.length}</span> মন্তব্য
            </button>
            <button class="feed-action-btn" onclick="sharePost('${p.id}')">
              🔗 শেয়ার
            </button>
          </div>

          <!-- Comments Section -->
          <div id="comments-box-${p.id}" style="margin-top:0.75rem; padding-top:0.75rem; border-top:1px solid rgba(255,255,255,0.06); display:${comments.length ? 'block' : 'none'};">
            <div class="comments-list" id="comments-list-${p.id}">
              ${comments.map(c => `
                <div style="font-size:0.82rem; margin-bottom:0.5rem; background:rgba(255,255,255,0.03); padding:0.5rem 0.75rem; border-radius:6px;">
                  <strong style="color:var(--crimson-primary,#c41230);">${c.author}:</strong>
                  <span style="color:rgba(255,255,255,0.85);">${c.content}</span>
                </div>
              `).join('')}
            </div>
            <div style="display:flex; gap:0.5rem; margin-top:0.5rem;">
              <input type="text" id="comment-input-${p.id}" placeholder="আপনার মন্তব্য লিখুন..." style="flex:1; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.15); border-radius:6px; padding:0.4rem 0.75rem; color:#fff; font-size:0.8rem; font-family:inherit;" onkeypress="if(event.key==='Enter') submitComment('${p.id}')" />
              <button class="btn-solid-crimson" style="padding:0.35rem 0.75rem; font-size:0.75rem;" onclick="submitComment('${p.id}')">মন্তব্য</button>
            </div>
          </div>
        </div>
      `;
      }).join('');
    }

    async function reactPost(id, btn) {
      try {
        const res = await fetch('/api/network?action=react', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ postId: id })
        });
        const data = await res.json();
        if (data.success) {
          const countSpan = btn.querySelector('.react-count');
          if (countSpan) countSpan.innerText = data.count;
          btn.style.color = 'var(--crimson-primary,#c41230)';
        }
      } catch (e) {
        console.error(e);
      }
    }

    function toggleCommentBox(id) {
      const box = document.getElementById(`comments-box-${id}`);
      if (box) box.style.display = box.style.display === 'none' ? 'block' : 'none';
    }

    async function submitComment(id) {
      const input = document.getElementById(`comment-input-${id}`);
      const content = input.value.trim();
      if (!content) return;

      try {
        const res = await fetch('/api/network?action=comment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ postId: id, content })
        });
        const d = await res.json();
        if (d.success) {
          input.value = '';
          fetchFeed();
        }
      } catch (e) {}
    }

    async function submitPost() {
      const input = document.getElementById('new-post-input');
      const content = input.value.trim();
      if (!content) {
        alert('পোস্টের বিষয়বস্তু লিখুন।');
        return;
      }

      const currentLang = window.TheWayI18n ? window.TheWayI18n.getLang() : 'bn';

      try {
        const res = await fetch('/api/network?action=posts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            content,
            post_type: currentPostType,
            lang: currentLang,
            country: 'Global'
          })
        });
        const d = await res.json();
        if (d.success) {
          input.value = '';
          fetchFeed();
        } else {
          alert(d.error || 'পোস্ট করতে সমস্যা হয়েছে।');
        }
      } catch (e) {
        alert('সার্ভারে সংযোগ ব্যর্থ হয়েছে।');
      }
    }

    function sharePost(id) {
      const shareUrl = `${window.location.origin}/feed.html#${id}`;
      navigator.clipboard.writeText(shareUrl).then(() => {
        alert('পোস্ট লিঙ্ক ক্লিপবোর্ডে কপি করা হয়েছে: ' + shareUrl);
      }).catch(() => {
        prompt('পোস্ট লিঙ্ক:', shareUrl);
      });
    }

    function loadMorePosts() {
      fetchFeed();
    }

    function renderSidebar() {
      const people = [
        { name: 'Omar Diallo', country: '🇸🇳', tag: 'Marxist' },
        { name: 'Laila Ahmadi', country: '🇮🇷', tag: 'Eco-socialist' },
        { name: 'Carlos Mendoza', country: '🇨🇱', tag: 'Leninist' }
      ];
      document.getElementById('suggested-people').innerHTML = people.map(p => `
        <div style="display:flex; align-items:center; gap:0.75rem;">
          <div style="width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,#c41230,#8b0000); display:flex; align-items:center; justify-content:center; font-size:0.85rem; font-weight:700; color:#fff; flex-shrink:0;">${p.name.split(' ').map(n=>n[0]).join('').slice(0,2)}</div>
          <div style="flex:1; min-width:0;">
            <div style="font-size:0.82rem; font-weight:600; color:#fff;">${p.name}</div>
            <div style="font-size:0.72rem; color:rgba(255,255,255,0.4);">${p.country} · ${p.tag}</div>
          </div>
          <button class="btn-follow" style="font-size:0.72rem; padding:0.25rem 0.6rem;" onclick="alert('অনুসরণ তালিকায় যোগ করা হয়েছে')">+</button>
        </div>
      `).join('');

      const events = [
        { title: 'Capital Reading Circle', date: 'Sep 25', lang: 'bn' },
        { title: 'Labour Rights Webinar', date: 'Oct 2', lang: 'en' }
      ];
      document.getElementById('sidebar-events').innerHTML = events.map(e => `
        <div style="padding:0.6rem; background:rgba(255,255,255,0.04); border-radius:7px; border:1px solid rgba(255,255,255,0.07);">
          <div style="font-size:0.78rem; font-weight:600; color:#fff; margin-bottom:0.2rem;">${e.title}</div>
          <div style="font-size:0.7rem; color:rgba(255,255,255,0.4);">📅 ${e.date} · <span class="lang-badge" style="font-size:0.65rem;">${e.lang.toUpperCase()}</span></div>
        </div>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', () => {
      fetchFeed();
      renderSidebar();
    });
  </script>
</body>
</html>
