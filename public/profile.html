<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
  <title>প্রোফাইল — দ্য ওয়ে</title>
  <meta name="description" content="The Way — Socialist profile page. View contributions, ideology, languages, and connections.">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/network.css">
</head>
<body id="top">

  <div id="theway-ticker-mount" class="theway-ticker-bar"></div>
  <header id="theway-header-mount" class="theway-header"></header>

  <main class="container profile-page">

    <!-- Profile Hero -->
    <div class="profile-hero" id="profile-hero">
      <div class="profile-hero-inner">
        <div class="profile-avatar-large" id="profile-avatar">
          <span id="profile-avatar-initials">A</span>
        </div>
        <div class="profile-info">
          <div class="profile-display-name" id="profile-display-name">
            <span id="profile-name-text">Ana Rodriguez</span>
            <span class="verified-badge" id="profile-verified-badge" style="display:none;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            </span>
          </div>
          <div class="profile-location-line" id="profile-location">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            <span id="profile-location-text">Argentina</span>
          </div>
          <div class="profile-ideology-row" id="profile-ideology-tags">
            <!-- Ideology tags rendered by JS -->
          </div>
          <div class="profile-langs-row" id="profile-langs">
            <!-- Language badges rendered by JS -->
          </div>
          <div class="profile-stats-row">
            <div class="profile-stat">
              <span class="profile-stat-number" id="stat-followers">0</span>
              <span class="profile-stat-label" data-i18n="profile.followers">অনুসরণকারী</span>
            </div>
            <div class="profile-stat">
              <span class="profile-stat-number" id="stat-following">0</span>
              <span class="profile-stat-label" data-i18n="profile.following">অনুসরণ করছেন</span>
            </div>
            <div class="profile-stat">
              <span class="profile-stat-number" id="stat-articles">0</span>
              <span class="profile-stat-label" data-i18n="profile.articles">প্রবন্ধ</span>
            </div>
            <div class="profile-stat">
              <span class="profile-stat-number" id="stat-translations">0</span>
              <span class="profile-stat-label" data-i18n="profile.translations">অনুবাদ</span>
            </div>
            <div class="profile-stat">
              <span class="profile-stat-number" id="stat-circles">0</span>
              <span class="profile-stat-label" data-i18n="profile.reading_circles">পাঠচক্র</span>
            </div>
          </div>
          <div class="profile-actions-row">
            <button class="btn-solid-crimson" id="btn-follow-profile" style="padding:0.45rem 1.2rem; font-size:0.85rem;" data-i18n="actions.follow">অনুসরণ করুন</button>
            <button class="btn-outline" id="btn-message-profile" style="padding:0.45rem 1rem; font-size:0.85rem; border:1px solid rgba(255,255,255,0.2); background:transparent; color:rgba(255,255,255,0.75); border-radius:7px; cursor:pointer; font-family:inherit;" data-i18n="actions.message">বার্তা পাঠান</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Profile Tabs & Content -->
    <div class="directory-tabs">
      <button class="directory-tab active" id="tab-posts" onclick="showProfileTab('posts')">পোস্ট</button>
      <button class="directory-tab" id="tab-articles" onclick="showProfileTab('articles')">প্রবন্ধ</button>
      <button class="directory-tab" id="tab-translations" onclick="showProfileTab('translations')">অনুবাদ</button>
      <button class="directory-tab" id="tab-groups" onclick="showProfileTab('groups')">গ্রুপ</button>
      <button class="directory-tab" id="tab-about" onclick="showProfileTab('about')">সম্পর্কে</button>
    </div>

    <!-- Posts Tab -->
    <div id="tab-content-posts" class="feed-container">
      <div id="profile-posts-feed">
        <div style="text-align:center; padding:3rem; color:rgba(255,255,255,0.35);">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin:0 auto 1rem; display:block; opacity:0.4;"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <p>কোনো পোস্ট নেই।</p>
        </div>
      </div>
    </div>

    <!-- Articles Tab -->
    <div id="tab-content-articles" style="display:none;">
      <div id="profile-articles-list">
        <div style="text-align:center; padding:3rem; color:rgba(255,255,255,0.35);">
          <p>কোনো প্রকাশিত প্রবন্ধ নেই।</p>
        </div>
      </div>
    </div>

    <!-- Translations Tab -->
    <div id="tab-content-translations" style="display:none;">
      <div id="profile-translations-list">
        <div style="text-align:center; padding:3rem; color:rgba(255,255,255,0.35);">
          <p>কোনো অনুবাদ নেই।</p>
        </div>
      </div>
    </div>

    <!-- Groups Tab -->
    <div id="tab-content-groups" style="display:none;">
      <div id="profile-groups-list" class="groups-grid">
        <div style="text-align:center; padding:3rem; color:rgba(255,255,255,0.35); grid-column:1/-1;">
          <p>কোনো গ্রুপে যোগ দেননি।</p>
        </div>
      </div>
    </div>

    <!-- About Tab -->
    <div id="tab-content-about" style="display:none;">
      <div style="background:linear-gradient(145deg,rgba(18,7,7,0.9),rgba(12,4,4,0.95)); border:1px solid rgba(255,255,255,0.08); border-radius:12px; padding:1.75rem; margin-top:1.5rem;">
        <h2 style="font-size:1rem; font-weight:700; color:#fff; margin-bottom:1.25rem; text-transform:uppercase; letter-spacing:0.05em; opacity:0.6;">সম্পর্কে</h2>
        <div id="profile-bio" style="color:rgba(255,255,255,0.7); line-height:1.7; font-size:0.9rem; margin-bottom:1.5rem;"></div>

        <div style="display:grid; gap:1rem;">
          <div class="profile-about-row" id="about-interests" style="display:none;">
            <h3 style="font-size:0.78rem; color:rgba(255,255,255,0.4); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:0.5rem;" data-i18n="profile.interests">আগ্রহ</h3>
            <div id="about-interest-tags" class="profile-ideology-row"></div>
          </div>
          <div class="profile-about-row" id="about-skills" style="display:none;">
            <h3 style="font-size:0.78rem; color:rgba(255,255,255,0.4); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:0.5rem;">অবদানের ক্ষেত্র</h3>
            <div id="about-skill-tags" class="profile-ideology-row"></div>
          </div>
        </div>
      </div>
    </div>

  </main>

  <footer id="theway-footer-mount" class="theway-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/script.js"></script>
  <script>
    // Profile Page Logic
    const IDEOLOGY_LABELS = {
      marxist: 'Marxist', leninist: 'Leninist', trotskyist: 'Trotskyist',
      maoist: 'Maoist', democratic_socialist: 'Democratic Socialist',
      libertarian_socialist: 'Libertarian Socialist', council_communist: 'Council Communist',
      eco_socialist: 'Eco-socialist', feminist_socialist: 'Feminist Socialist',
      anarchist: 'Anarchist', other: 'Other', undeclared: 'Undeclared'
    };

    const INTEREST_LABELS = {
      labour: 'Labour', political_economy: 'Political Economy', feminism: 'Feminism',
      ecology: 'Ecology', history: 'History', anti_colonialism: 'Anti-colonialism',
      culture: 'Culture', philosophy: 'Philosophy', imperialism: 'Imperialism', marxism: 'Marxism'
    };

    function showProfileTab(tab) {
      ['posts', 'articles', 'translations', 'groups', 'about'].forEach(t => {
        document.getElementById('tab-content-' + t).style.display = t === tab ? '' : 'none';
        document.getElementById('tab-' + t).classList.toggle('active', t === tab);
      });
    }

    async function loadProfile() {
      const params = new URLSearchParams(window.location.search);
      const userId = params.get('user') || params.get('id') || 'p1';
      
      try {
        const res = await fetch(`/api/network?action=profile&id=${encodeURIComponent(userId)}`);
        const data = await res.json();
        if (data && data.profile) {
          renderProfile(data.profile);
          loadUserPosts(data.profile.name || data.profile.pseudonym);
          return;
        }
      } catch (e) {}

      // Default profile fallback
      const demoProfile = {
        display_name: 'Ana Rodriguez',
        country_name: 'Argentina',
        ideology_tags: ['marxist', 'eco_socialist', 'feminist_socialist'],
        languages: [{code: 'es'}, {code: 'en'}],
        interest_tags: ['labour', 'political_economy', 'feminism', 'ecology'],
        contribution_skills: ['translation', 'writing', 'research'],
        bio: 'Marxist researcher and labor organizer from Argentina. Working on feminist political economy and ecological socialism.',
        followers_count: 147,
        following_count: 83,
        articles_count: 8,
        translations_count: 14,
        reading_circles_count: 3,
        is_verified: true
      };

      renderProfile(demoProfile);
      loadUserPosts('Ana Rodriguez');
    }

    async function loadUserPosts(authorName) {
      try {
        const res = await fetch('/api/network?action=posts');
        const data = await res.json();
        const posts = (data.posts || []).filter(p => p.author.toLowerCase().includes(authorName.toLowerCase()));
        const container = document.getElementById('profile-posts-feed');
        if (!posts.length) {
          container.innerHTML = '<div style="text-align:center; padding:3rem; color:rgba(255,255,255,0.4);">এই সদস্যের কোনো পোস্ট পাওয়া যায়নি।</div>';
          return;
        }
        container.innerHTML = posts.map(p => `
          <div class="feed-post" style="margin-bottom:1rem;">
            <div style="font-size:0.8rem; color:var(--crimson-primary,#c41230); font-weight:700; margin-bottom:0.4rem;">
              ${p.post_type === 'debate' ? '💬 বিতর্ক' : (p.post_type === 'question' ? '❓ প্রশ্ন' : '📝 পোস্ট')}
            </div>
            <div style="color:#fff; font-size:0.95rem; line-height:1.55; white-space:pre-line;">${p.content}</div>
            <div style="margin-top:0.75rem; font-size:0.75rem; color:rgba(255,255,255,0.4);">
              ✊ ${(p.reactions && p.reactions.solidarity) || 0} সংহতি · 💬 ${(p.comments && p.comments.length) || 0} মন্তব্য
            </div>
          </div>
        `).join('');
      } catch (e) {}
    }

    function renderProfile(profile) {
      if (!profile) return;
      const name = profile.display_name || profile.name || profile.pseudonym || 'Comrade';
      const initials = name.split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();
      document.getElementById('profile-avatar-initials').textContent = initials;
      document.getElementById('profile-name-text').textContent = name;
      document.getElementById('profile-location-text').textContent = profile.country_name || profile.country || '';

      if (profile.is_verified) {
        document.getElementById('profile-verified-badge').style.display = 'inline-flex';
      }

      const ideologies = profile.ideology_tags || profile.ideologies || ['Marxist'];
      document.getElementById('profile-ideology-tags').innerHTML = ideologies.map(tag =>
        `<span class="ideology-tag">${IDEOLOGY_LABELS[tag] || tag}</span>`
      ).join('');

      const languages = profile.languages || ['bn'];
      document.getElementById('profile-langs').innerHTML = '<strong style="color:rgba(255,255,255,0.5);">Languages:</strong> ' +
        languages.map(l => `<span class="lang-badge">${(typeof l === 'object' ? l.code : l).toUpperCase()}</span>`).join('');

      const contrib = profile.contributions || {};
      document.getElementById('stat-followers').textContent = profile.followers_count || 42;
      document.getElementById('stat-following').textContent = profile.following_count || 19;
      document.getElementById('stat-articles').textContent = profile.articles_count || contrib.articles || 5;
      document.getElementById('stat-translations').textContent = profile.translations_count || contrib.translations || 8;
      document.getElementById('stat-circles').textContent = profile.reading_circles_count || contrib.circles || 2;

      document.getElementById('profile-bio').textContent = profile.bio || 'সমাজতান্ত্রিক চিন্তন ও বৈশ্বিক গণআন্দোলনের সক্রিয় কর্মী ও পাঠক।';

      const interests = profile.interest_tags || profile.interests || [];
      if (interests.length) {
        document.getElementById('about-interests').style.display = '';
        document.getElementById('about-interest-tags').innerHTML = interests.map(tag =>
          `<span class="ideology-tag" style="background:rgba(232,184,75,0.1); border-color:rgba(232,184,75,0.25); color:rgba(232,184,75,0.85);">${INTEREST_LABELS[tag] || tag}</span>`
        ).join('');
      }
    }

    document.addEventListener('DOMContentLoaded', loadProfile);

    document.getElementById('btn-follow-profile')?.addEventListener('click', function() {
      if (this.textContent.includes('অনুসরণ') || this.textContent.includes('Follow')) {
        this.textContent = '✓ অনুসরণ করছেন';
        this.style.background = 'rgba(34,197,94,0.2)';
        this.style.borderColor = '#4ade80';
        this.style.color = '#4ade80';
      } else {
        this.textContent = '+ অনুসরণ করুন';
        this.style.background = '';
        this.style.borderColor = '';
        this.style.color = '';
      }
    });
  </script>
</body>
</html>
