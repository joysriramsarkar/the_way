<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
  <link rel="alternate icon" type="image/svg+xml" href="favicon.svg" />
  <title>নিবন্ধন — দ্য ওয়ে (The Way)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --crimson:      #c2182b;
      --crimson-glow: rgba(194, 24, 43, 0.35);
      --crimson-dark: #8b0e1b;
      --gold:         #d97706;
      --bg:           #090d14;
      --card-bg:      rgba(18, 23, 34, 0.92);
      --input-bg:     #0d121c;
      --text:         #f3f4f6;
      --text-muted:   #9ca3af;
      --border:       rgba(255, 255, 255, 0.1);
      --shadow:       0 25px 60px rgba(0, 0, 0, 0.75);
    }

    html, body {
      height: 100%;
      font-family: 'Hind Siliguri', 'Inter', sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #161d2b 0%, var(--bg) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: var(--text);
      padding: 2rem 1.5rem;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, var(--crimson-glow) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      filter: blur(60px);
      opacity: 0.45;
    }

    .register-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 40px 36px;
      width: 100%;
      max-width: 480px;
      box-shadow: var(--shadow), 0 0 0 1px rgba(194, 24, 43, 0.25);
      position: relative;
      z-index: 1;
      animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .header-block {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo-img {
      height: 48px;
      margin-bottom: 12px;
    }

    .page-title {
      font-size: 23px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }

    .page-sub {
      font-size: 13.5px;
      color: var(--text-muted);
    }

    .msg-box {
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13px;
      margin-bottom: 18px;
      line-height: 1.5;
      display: none;
      text-align: left;
    }
    .msg-box.visible { display: flex; align-items: center; gap: 8px; }
    .msg-box.error { background: rgba(127, 29, 29, 0.4); border: 1px solid #991b1b; color: #fca5a5; }
    .msg-box.success { background: rgba(6, 78, 59, 0.4); border: 1px solid #065f46; color: #6ee7b7; }
    .msg-box.info { background: rgba(30, 58, 138, 0.4); border: 1px solid #1e40af; color: #93c5fd; }

    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #e5e7eb;
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: var(--text-muted);
      font-size: 15px;
      pointer-events: none;
      user-select: none;
    }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 14px 11px 40px;
      font-family: inherit;
      font-size: 14px;
      color: #fff;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-textarea {
      padding-left: 14px;
      min-height: 60px;
      resize: vertical;
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--crimson);
      box-shadow: 0 0 0 3px var(--crimson-glow);
      background: #111827;
    }

    .toggle-pw-btn {
      position: absolute;
      right: 12px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
      border-radius: 6px;
    }
    .toggle-pw-btn:hover { color: #fff; }

    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--crimson) 0%, var(--crimson-dark) 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 13px 20px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 15px var(--crimson-glow);
      transition: all 0.25s ease;
      margin-top: 10px;
    }

    .submit-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(194, 24, 43, 0.6);
      filter: brightness(1.08);
    }

    .submit-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .btn-spinner {
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    .btn-spinner.visible { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .footer-links {
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .footer-links a {
      color: #93c5fd;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }
    .footer-links a:hover {
      color: #bfdbfe;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="register-card">

    <div class="header-block">
      <a href="/" title="দ্য ওয়ে মূলপাতা">
        <img loading="lazy" src="assets/images/logo.svg" alt="The Way (দ্য ওয়ে)" class="logo-img" onerror="this.src='logo.svg'" />
      </a>
      <h1 class="page-title">নতুন অ্যাকাউন্ট নিবন্ধন</h1>
      <p class="page-sub">দ্য ওয়ে আন্তর্জাতিক সমাজতান্ত্রিক চিন্তন ফোরামে যোগ দিন</p>
    </div>

    <div id="msg-box" class="msg-box" role="alert"></div>

    <form id="register-form">
      <div class="form-group">
        <label for="reg-name" class="form-label">আপনার পূর্ণ নাম *</label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input type="text" id="reg-name" class="form-input" placeholder="যেমন: ড. সৌমিক রায়হান" required autofocus />
        </div>
      </div>

      <div class="form-group">
        <label for="reg-email" class="form-label">ইমেইল অ্যাড্রেস *</label>
        <div class="input-wrapper">
          <span class="input-icon">✉️</span>
          <input type="email" id="reg-email" class="form-input" placeholder="আপনার ইমেইল লিখুন" required autocomplete="email" />
        </div>
      </div>

      <div class="form-group">
        <label for="reg-password" class="form-label">গোপন পাসওয়ার্ড * (কমপক্ষে ৬ অক্ষর)</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input type="password" id="reg-password" class="form-input" placeholder="••••••••" required minlength="6" autocomplete="new-password" />
          <button type="button" class="toggle-pw-btn" id="reg-toggle-pw" title="পাসওয়ার্ড দেখুন/লুকান">👁️</button>
        </div>
      </div>

      <div class="form-group">
        <label for="reg-role" class="form-label">অ্যাকাউন্টের ধরন / ভূমিকা</label>
        <div class="input-wrapper">
          <span class="input-icon">🏷️</span>
          <select id="reg-role" class="form-select">
            <option value="Contributor" selected>সাধারণ লেখক ও পাঠক (Contributor)</option>
            <option value="Editor">সহ-সম্পাদক (Editor)</option>
            <option value="Moderator">মডারেটর (Moderator)</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="reg-bio" class="form-label">সংক্ষিপ্ত পরিচিতি বা কাজের ক্ষেত্র (ঐচ্ছিক)</label>
        <textarea id="reg-bio" class="form-textarea" placeholder="যেমন: রাজনৈতিক অর্থনীতি গবেষক, ট্রেড ইউনিয়ন সংগঠক..."></textarea>
      </div>

      <button type="submit" class="submit-btn" id="reg-submit-btn">
        <span class="btn-spinner" id="reg-spinner"></span>
        <span id="reg-btn-text">অ্যাকাউন্ট তৈরি করুন ➔</span>
      </button>
    </form>

    <div class="footer-links">
      <div>
        ইতিমধ্যে অ্যাকাউন্ট রয়েছে?
        <a href="/admin-login.html">এখানে লগইন করুন</a>
      </div>
      <div>
        <a href="/" style="color:var(--text-muted); font-size:12px;">← মূল পোর্টাল ও পত্রিকায় ফিরে যান</a>
      </div>
    </div>

  </div>

  <script>
    const TOKEN_KEY = 'theway_token';
    const msgBox = document.getElementById('msg-box');
    const submitBtn = document.getElementById('reg-submit-btn');
    const btnSpinner = document.getElementById('reg-spinner');
    const btnText = document.getElementById('reg-btn-text');
    const togglePwBtn = document.getElementById('reg-toggle-pw');
    const passwordInput = document.getElementById('reg-password');

    togglePwBtn.addEventListener('click', function () {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      togglePwBtn.textContent = isPassword ? '🙈' : '👁️';
    });

    function showMsg(type, text) {
      msgBox.className = 'msg-box visible ' + type;
      msgBox.innerHTML = `<span>${text}</span>`;
    }

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      btnSpinner.className = 'btn-spinner' + (isLoading ? ' visible' : '');
      btnText.textContent = isLoading ? 'অ্যাকাউন্ট তৈরি হচ্ছে...' : 'অ্যাকাউন্ট তৈরি করুন ➔';
    }

    document.getElementById('register-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = passwordInput.value;
      const role = document.getElementById('reg-role').value;
      const bio = document.getElementById('reg-bio').value.trim();

      if (!name || !email || !password) {
        showMsg('error', 'দয়া করে সকল প্রয়োজনীয় তথ্য পূরণ করুন।');
        return;
      }

      setLoading(true);

      try {
        const res = await fetch('/api/auth?action=register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, role, bio })
        });

        const data = await res.json();
        setLoading(false);

        if (res.ok && data.success && data.token) {
          localStorage.setItem(TOKEN_KEY, data.token);
          localStorage.setItem('theway_token', data.token);

          showMsg('success', 'অ্যাকাউন্ট সফলভাবে তৈরি হয়েছে! ড্যাশবোর্ডে নিয়ে যাওয়া হচ্ছে...');
          setTimeout(function () {
            if (['Admin', 'Moderator', 'Editor'].includes(role)) {
              window.location.replace('/admin.html');
            } else {
              window.location.replace('/submit-article.html');
            }
          }, 600);
        } else {
          showMsg('error', data.error || 'নিবন্ধন ব্যর্থ হয়েছে। অন্য ইমেইল দিয়ে চেষ্টা করুন।');
        }
      } catch (err) {
        setLoading(false);
        showMsg('error', 'সার্ভারে সংযোগ করা যায়নি। দয়া করে আবার চেষ্টা করুন।');
      }
    });
  </script>
</body>
</html>
