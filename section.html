<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
  <link rel="alternate icon" type="image/svg+xml" href="favicon.svg" />
  <title>বিষয়ভিত্তিক সংগ্রহশালা — দ্য ওয়ে (The Way)</title>
  
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .section-hero-banner {
      background: linear-gradient(135deg, #18090c 0%, #0d1117 100%);
      color: #fff;
      padding: 3rem 2rem;
      border-radius: var(--radius-lg);
      margin: 2rem 0;
      border: 1px solid rgba(194, 24, 43, 0.35);
      position: relative;
    }
    .section-hero-title {
      font-family: var(--font-bengali-serif);
      font-size: 2.4rem;
      font-weight: 900;
      color: #fff;
      margin-bottom: 0.5rem;
    }
    .section-hero-sub {
      font-size: 1.1rem;
      color: var(--gold-bright);
      max-width: 750px;
      line-height: 1.6;
    }
    .section-curated-grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 2rem;
      margin-bottom: 3rem;
    }
    .curated-hero-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      overflow: hidden;
    }
    .curated-hero-card img {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
    }
    .curated-hero-body {
      padding: 1.5rem;
    }
    .curated-hero-body h2 {
      font-family: var(--font-bengali-serif);
      font-size: 1.6rem;
      margin-bottom: 0.6rem;
    }
    .curated-list-col {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .curated-sub-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 1rem;
      border-radius: var(--radius-sm);
      display: flex;
      gap: 1rem;
      align-items: center;
    }
    .curated-sub-card img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: var(--radius-sm);
    }
    .archive-filter-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--text-primary);
      padding-bottom: 0.85rem;
      margin: 3rem 0 1.8rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
  </style>
</head>
<body id="top">

  <!-- Ticker Mount -->
  <div id="theway-ticker-mount" class="theway-ticker-bar"></div>

  <!-- Header Mount -->
  <header id="theway-header-mount" class="theway-header"></header>

  <!-- Main Section Body -->
  <main class="container" id="section-main-content">
    
    <!-- Section Dynamic Header Banner -->
    <div class="section-hero-banner" id="sec-banner-box">
      <div class="lead-section-badge" style="position:static; display:inline-block; margin-bottom:0.8rem;">সেকশন ফোকাস</div>
      <h1 class="section-hero-title" id="sec-title-display">লোড হচ্ছে...</h1>
      <p class="section-hero-sub" id="sec-sub-display"></p>
    </div>

    <!-- Curated Spotlight Grid (Hero + 4 Selected) -->
    <div id="sec-curated-spotlight"></div>

    <!-- All Section Articles Archive -->
    <div class="archive-filter-bar">
      <h3 style="font-family:var(--font-bengali-serif); font-size:1.4rem;" id="archive-count-heading">আর্কাইভের প্রবন্ধসমূহ</h3>
      <input type="text" id="sec-archive-search" placeholder="এই বিষয়ের লেখা খুঁজুন..." class="subscribe-input" style="max-width:280px; font-size:0.82rem;">
    </div>

    <div class="articles-triplet-grid" id="sec-all-articles-grid">
      <!-- Populated dynamically -->
    </div>

  </main>

  <!-- Footer Mount -->
  <footer id="theway-footer-mount" class="theway-footer"></footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/js/components.js"></script>
  <script>
    (async function() {
      const urlParams = new URLSearchParams(window.location.search);
      const secSlug = urlParams.get('sec') || 'theory-philosophy';

      const sections = (window.THE_WAY_CONFIG && window.THE_WAY_CONFIG.defaultSections) || [];
      const currentSec = sections.find(s => s.slug === secSlug) || {
        name: 'তত্ত্ব ও দর্শন',
        name_en: 'Theory & Philosophy',
        subtitle: 'মার্ক্সীয় দ্বন্দ্ববাদ, ঐতিহাসিক বস্তুবাদ ও উত্তর-ঔপনিবেশিক মুক্তিচিন্তা'
      };

      const lang = window.TheWayComponents ? window.TheWayComponents.getLanguage() : 'bn';
      const toBn = window.TheWayComponents ? window.TheWayComponents.toBengaliDigits : (n) => n;

      document.getElementById('sec-title-display').textContent = lang === 'bn' ? (currentSec.name || currentSec.name_en) : (currentSec.name_en || currentSec.name);
      document.getElementById('sec-sub-display').textContent = currentSec.subtitle || '';
      document.title = `${currentSec.name || 'সেকশন'} — দ্য ওয়ে (The Way)`;

      // Fetch all articles
      let articles = (window.THE_WAY_CONFIG && window.THE_WAY_CONFIG.defaultArticles) || [];
      try {
        const res = await fetch('/api/articles?action=list');
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data) && data.length > 0) articles = data;
        }
      } catch(e) {}

      let secArticles = secSlug === 'all' ? articles : articles.filter(a => (a.section || '').toLowerCase() === secSlug.toLowerCase());
      if (secArticles.length === 0) secArticles = articles; // fallback

      // Render Spotlight
      const spotlightMount = document.getElementById('sec-curated-spotlight');
      if (secArticles.length > 0) {
        const heroArt = secArticles[0];
        const otherArts = secArticles.slice(1, 5);

        spotlightMount.innerHTML = `
          <div class="section-curated-grid">
            <article class="curated-hero-card">
              <a href="/article.html?slug=${heroArt.slug}">
                <img loading="lazy" src="${heroArt.hero_img_url || 'assets/images/img1.webp'}" alt="${heroArt.title}">
              </a>
              <div class="curated-hero-body">
                <h2><a href="/article.html?slug=${heroArt.slug}">${heroArt.title}</a></h2>
                <p style="font-size:0.95rem; color:var(--text-secondary); line-height:1.6; margin-bottom:1rem;">${heroArt.deck || ''}</p>
                <div style="font-size:0.8rem; color:var(--text-muted);">
                  <span>✍️ ${heroArt.author}</span> • <span>📅 ${new Date(heroArt.published_at || Date.now()).toLocaleDateString('bn-BD')}</span>
                </div>
              </div>
            </article>

            <div class="curated-list-col">
              ${otherArts.map(a => `
                <article class="curated-sub-card">
                  <img loading="lazy" src="${a.hero_img_url || 'assets/images/img2.webp'}" alt="${a.title}">
                  <div>
                    <h4 style="font-family:var(--font-bengali-serif); font-size:1rem; margin-bottom:0.3rem;">
                      <a href="/article.html?slug=${a.slug}">${a.title}</a>
                    </h4>
                    <span style="font-size:0.75rem; color:var(--text-muted);">${a.author}</span>
                  </div>
                </article>
              `).join('')}
            </div>
          </div>
        `;
      }

      // Render All Grid
      function renderArchive(list) {
        const grid = document.getElementById('sec-all-articles-grid');
        grid.innerHTML = list.map(art => `
          <article class="standard-article-card">
            <a href="/article.html?slug=${art.slug}" class="card-media-wrapper">
              <img loading="lazy" src="${art.hero_img_url || 'assets/images/img3.webp'}" alt="${art.title}">
            </a>
            <div class="card-body-content">
              <span class="card-tag-pill">${art.section_name || art.section}</span>
              <h3 class="card-heading">
                <a href="/article.html?slug=${art.slug}">${art.title}</a>
              </h3>
              <p class="card-excerpt">${art.deck || ''}</p>
              <div class="card-footer-meta">
                <span>✍️ ${art.author}</span>
                <span>⏱️ ${toBn(Math.ceil(((art.content_html || '').length + (art.deck || '').length) / 800))} ${lang === 'bn' ? 'মিনিট' : 'min'}</span>
              </div>
            </div>
          </article>
        `).join('');
      }

      renderArchive(secArticles);

      // Search filter in section
      document.getElementById('sec-archive-search')?.addEventListener('input', (e) => {
        const q = e.target.value.toLowerCase();
        const filtered = secArticles.filter(a => (a.title || '').toLowerCase().includes(q) || (a.deck || '').toLowerCase().includes(q));
        renderArchive(filtered);
      });
    })();
  </script>
</body>
</html>
