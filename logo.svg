<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 70" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="wayCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e52b3c"/>
      <stop offset="50%" stop-color="#c2182b"/>
      <stop offset="100%" stop-color="#8b0e1b"/>
    </linearGradient>
    <linearGradient id="wayGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="flameGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Emblem / Torch & Star -->
  <g transform="translate(4, 5)">
    <!-- Outer Shield / Diamond -->
    <polygon points="30,2 58,30 30,58 2,30" fill="#0d1117" stroke="url(#wayCrimson)" stroke-width="2.5"/>
    <polygon points="30,7 53,30 30,53 7,30" fill="#161b22" stroke="url(#wayGold)" stroke-width="0.8" opacity="0.6"/>
    
    <!-- Revolutionary Torch / Flame -->
    <path d="M30 12 C33 18, 38 21, 35 28 C33 32, 29 33, 27 38 C26 40, 26 43, 30 46 C24 44, 21 38, 22 33 C23 27, 28 24, 27 18 C28 16, 29 14, 30 12 Z" fill="url(#wayCrimson)" filter="url(#flameGlow)"/>
    <path d="M30 20 C32 24, 34 26, 32 30 C31 32, 29 34, 29 38 C28 35, 27 32, 28 29 C29 25, 30 23, 30 20 Z" fill="url(#wayGold)"/>
    
    <!-- Socialist Star Accent -->
    <polygon points="30,48 31.8,53.5 37.5,53.5 32.9,56.8 34.6,62.3 30,58.9 25.4,62.3 27.1,56.8 22.5,53.5 28.2,53.5" fill="url(#wayGold)" transform="matrix(0.5 0 0 0.5 15 15)"/>
  </g>

  <!-- Typography: Bengali & English Brand -->
  <!-- Bengali Title -->
  <text x="74" y="36" font-family="'Hind Siliguri', 'Noto Serif Bengali', 'Anek Bangla', sans-serif" font-size="30" font-weight="800" fill="#f3f4f6" letter-spacing="0.5">
    দ্য <tspan fill="url(#wayCrimson)">ওয়ে</tspan>
  </text>

  <!-- English Subtitle / Divider -->
  <line x1="184" y1="16" x2="184" y2="48" stroke="#374151" stroke-width="1.5"/>

  <!-- English Title -->
  <text x="196" y="32" font-family="'Playfair Display', 'Cinzel', 'Inter', serif" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="3.5">
    THE WAY
  </text>
  <text x="197" y="48" font-family="'Inter', sans-serif" font-size="8.5" font-weight="600" fill="url(#wayGold)" letter-spacing="2.2">
    VOICE OF SOCIALISM &amp; SOLIDARITY
  </text>
</svg>
