<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Article Editor — The Privatian Family</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="article.css" />
  <style>
/* ══ EDITOR SHELL ══════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; }
:root {
  --navy: #0a528e;
  --dark: #0d1f35;
  --serif: 'Libre Baskerville', Georgia, serif;
  --sans:  'Source Sans 3', system-ui, sans-serif;
  --tb-h:  52px;
  --content-w: 720px;
  --radius: 8px;
}
html { scroll-behavior: smooth; }
body { padding-top: var(--tb-h); background: #f8f9fb; margin: 0; }

/* ── TOP TOOLBAR ─────────────────────────────────────────────── */
#ed-toolbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
  height: var(--tb-h);
  background: #0d1f35;
  display: flex; align-items: center; gap: 10px;
  padding: 0 18px;
  border-bottom: 1px solid rgba(255,255,255,.08);
  box-shadow: 0 2px 16px rgba(0,0,0,.3);
}
.tb-back {
  display: inline-flex; align-items: center; gap: 7px;
  color: rgba(255,255,255,.6); text-decoration: none;
  font: 600 12px/1 var(--sans); letter-spacing: .04em;
  padding: 6px 10px; border-radius: 6px; transition: .15s; flex-shrink: 0;
}
.tb-back:hover { background: rgba(255,255,255,.09); color: #fff; }
.tb-sep { width: 1px; height: 26px; background: rgba(255,255,255,.12); flex-shrink: 0; }
.tb-slug-wrap { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
.tb-label { font: 700 10px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.35); flex-shrink: 0; }
#ed-slug {
  font: 400 12.5px/1 var(--sans); color: rgba(255,255,255,.7);
  background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12);
  border-radius: 5px; padding: 5px 10px; outline: none;
  width: 220px; max-width: 100%;
  transition: border-color .15s, background .15s;
}
#ed-slug:focus { border-color: rgba(255,255,255,.3); background: rgba(255,255,255,.12); color: #fff; }
.tb-status { 
  font: 700 10px/1 var(--sans); letter-spacing: .09em; text-transform: uppercase;
  padding: 4px 10px; border-radius: 20px; flex-shrink: 0; white-space: nowrap;
}
.tb-status.draft     { background: rgba(251,191,36,.12); color: #fbbf24; }
.tb-status.published { background: rgba(52,211,153,.12); color: #34d399; }
#ed-autosave {
  font: 400 11px/1 var(--sans); color: rgba(255,255,255,.28);
  flex-shrink: 0; white-space: nowrap; min-width: 120px; text-align: right;
}
.tb-btn {
  font: 600 12.5px/1 var(--sans); border: none; border-radius: 7px;
  padding: 8px 16px; cursor: pointer; transition: all .15s; flex-shrink: 0; white-space: nowrap;
}
.tb-btn-preview { background: rgba(255,255,255,.08); color: rgba(255,255,255,.7); border: 1px solid rgba(255,255,255,.14); }
.tb-btn-preview:hover { background: rgba(255,255,255,.15); color: #fff; }
.tb-btn-save { background: rgba(10,82,142,.85); color: #fff; border: 1px solid rgba(10,82,142,.4); }
.tb-btn-save:hover { background: #0a528e; }
.tb-btn-save:disabled { opacity: .5; cursor: default; }
.tb-btn-publish { background: #1a7a4a; color: #fff; }
.tb-btn-publish:hover { background: #158040; }
.tb-btn-unpublish { background: rgba(220,38,38,.8); color: #fff; }
.tb-btn-unpublish:hover { background: #dc2626; }

/* ── CANVAS WRAPPER ──────────────────────────────────────────── */
#ed-canvas {
  max-width: var(--content-w);
  margin: 0 auto;
  padding: 0 0 80px;
}

/* ── HERO BAND (title area) ──────────────────────────────────── */
#ed-hero-band {
  background: #fff;
  border-bottom: 1px solid #e8e0d4;
  padding: 40px 32px 36px;
  margin-bottom: 0;
}

/* Section picker */
.ed-section-picker {
  position: relative; display: inline-block; margin-bottom: 18px;
}
#ed-section-pill {
  display: inline-flex; align-items: center; gap: 6px;
  font: 700 11px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase;
  color: #fff; background: var(--navy); padding: 5px 12px 5px 14px;
  border-radius: 3px; cursor: pointer; user-select: none;
  transition: opacity .15s;
}
#ed-section-pill:hover { opacity: .85; }
#ed-section-pill svg { flex-shrink: 0; }
.ed-section-dd {
  display: none; position: absolute; top: calc(100% + 8px); left: 0; z-index: 200;
  background: #fff; border: 1px solid #dde4ea; border-radius: 10px;
  box-shadow: 0 8px 32px rgba(0,0,0,.13);
  min-width: 190px; overflow: hidden;
}
.ed-section-dd.open { display: block; }
.ed-section-opt {
  padding: 11px 18px; font: 600 13px/1 var(--sans); color: #374151;
  cursor: pointer; transition: background .1s;
}
.ed-section-opt:hover { background: #f0f5fa; color: var(--navy); }
.ed-section-opt.active { color: var(--navy); background: #e8f1f9; }

/* Editable fields */
.ed-headline {
  font-family: var(--serif); font-size: clamp(28px, 4vw, 44px); font-weight: 700;
  line-height: 1.18; color: #0d1f35; margin: 0 0 18px; letter-spacing: -.01em;
  outline: none; min-height: 1.2em;
}
.ed-deck {
  font-family: var(--serif); font-size: clamp(16px, 2vw, 20px); font-weight: 400;
  line-height: 1.55; color: #4a6070; margin: 0 0 24px; font-style: italic;
  outline: none; min-height: 1.6em;
}
.ed-meta {
  display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 10px;
  font: 400 13px/1 var(--sans); color: #6b7f92;
  padding-top: 20px; border-top: 1px solid #e4ddd5;
}
.ed-meta strong { color: #0d1f35; font-weight: 700; }
.meta-dot { color: #b0bec9; }
[data-ed]:empty:not(:focus)::before {
  content: attr(data-ph); color: #b8c8d4; pointer-events: none;
  font-style: normal; font-weight: 400;
}

/* ── ARTICLE BODY AREA ───────────────────────────────────────── */
#ed-body {
  background: #fff;
  padding: 32px 32px 40px;
  border-bottom: 1px solid #e8e0d4;
}

/* Hero image zone */
#ed-img-zone {
  position: relative; cursor: pointer; border-radius: 4px;
  overflow: hidden; margin-bottom: 12px;
  min-height: 260px; background: #f2f5f8;
  border: 2px dashed #c9d8e4;
  display: flex; align-items: center; justify-content: center;
  transition: border-color .2s, background .2s;
}
#ed-img-zone:hover { border-color: var(--navy); background: #e8f1f9; }
#ed-img-zone.has-image { min-height: unset; border: none; background: none; }
#ed-img-zone.has-image:hover::after {
  content: ''; position: absolute; inset: 0;
  background: rgba(13,31,53,.45); border-radius: 4px;
}
.img-zone-placeholder {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  color: #7a9ab2; pointer-events: none;
}
.img-zone-placeholder svg { opacity: .6; }
.img-zone-placeholder span { font: 600 13px/1 var(--sans); }
.img-zone-placeholder small { font: 400 11px/1 var(--sans); color: #9db5c3; }
#ed-hero-img { width: 100%; height: auto; max-height: 520px; object-fit: cover; display: block; border-radius: 2px; }
.img-change-btn {
  position: absolute; bottom: 12px; right: 12px; z-index: 10;
  font: 600 11px/1 var(--sans); padding: 6px 12px; border-radius: 6px;
  background: rgba(13,31,53,.8); color: #fff; border: 1px solid rgba(255,255,255,.2);
  cursor: pointer; opacity: 0; transition: opacity .2s;
}
#ed-img-zone:hover .img-change-btn { opacity: 1; }
.ed-fig-caption {
  display: flex; gap: 16px; align-items: flex-start;
  padding-top: 10px; border-top: 1px solid #eee; margin-bottom: 28px;
}
.ed-fig-caption-text {
  flex: 1; font: 400 12.5px/1.5 var(--sans); color: #7a8d9e; outline: none;
  min-height: 18px;
}
.ed-fig-credit {
  font: 400 11px/1.5 var(--sans); color: #a0b0bc; outline: none;
  min-height: 16px; flex-shrink: 0;
}

/* Content blocks */
#ed-content { outline: none; }
#ed-content > * { position: relative; }
#ed-content p {
  font-family: var(--serif); font-size: 18px; line-height: 1.78; color: #1a2d3e; margin: 0 0 1.5em;
  outline: none;
}
#ed-content p.lead { font-size: 20px !important; line-height: 1.65 !important; color: #0d1f35 !important; }
#ed-content h2 {
  font: 700 13px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase;
  color: var(--navy); margin: 2.4em 0 .9em; padding-top: 1.4em;
  border-top: 2px solid var(--navy); outline: none;
}
#ed-content h3 {
  font-family: var(--serif); font-size: 22px; font-weight: 700; color: #0d1f35;
  margin: 2em 0 .7em; outline: none;
}
#ed-content blockquote.article-pullquote { outline: none; }
#ed-content blockquote.article-pullquote p { outline: none; }
#ed-content blockquote.article-pullquote cite { outline: none; }
#ed-content figure { margin: 0 0 2em; }
#ed-content figure img { width: 100%; border-radius: 3px; }
#ed-content figure figcaption { font: 400 12px/1.5 var(--sans); color: #7a8d9e; padding-top: 8px; border-top: 1px solid #eee; margin-top: 8px; outline: none; }
#ed-content hr { border: none; border-top: 2px solid #e4ddd5; margin: 2.5em 0; }

/* Block hover: show delete btn on left */
#ed-content > [data-block] {
  padding-left: 40px; margin-left: -40px;
  transition: background .12s;
}
#ed-content > [data-block]::before {
  content: '⋮⋮'; position: absolute; left: 6px; top: 50%; transform: translateY(-50%);
  font-size: 14px; color: transparent; cursor: grab; letter-spacing: -2px;
  transition: color .15s;
}
#ed-content > [data-block]:hover::before { color: #c4cdd6; }
.block-del {
  position: absolute; right: -32px; top: 50%; transform: translateY(-50%);
  width: 24px; height: 24px; border-radius: 50%;
  background: #fee2e2; border: none; color: #dc2626;
  font-size: 15px; line-height: 1; cursor: pointer;
  display: none; align-items: center; justify-content: center;
  transition: background .12s;
}
#ed-content > [data-block]:hover .block-del { display: flex; }
.block-del:hover { background: #dc2626; color: #fff; }

/* Add-block bar */
#ed-add-bar {
  display: flex; align-items: center; gap: 8px;
  margin-top: 24px; padding: 12px 0 0;
  border-top: 1px dashed #d0dae3;
}
#ed-add-bar span { font: 600 11px/1 var(--sans); letter-spacing: .06em; text-transform: uppercase; color: #9db5c3; }
.add-block-btn {
  display: inline-flex; align-items: center; gap: 5px;
  font: 600 12px/1 var(--sans); color: var(--navy);
  background: #e8f1f9; border: 1px solid #c8daea;
  padding: 6px 12px; border-radius: 20px; cursor: pointer;
  transition: all .15s;
}
.add-block-btn:hover { background: var(--navy); color: #fff; border-color: var(--navy); }
.add-block-btn svg { flex-shrink: 0; }

/* ── AUTHOR BIO ───────────────────────────────────────────────── */
#ed-bio-card {
  background: #f7f9fb; border: 1px solid #e4eaf0; border-radius: 10px;
  padding: 24px; margin: 32px 32px 0;
  display: grid; grid-template-columns: 52px 1fr; gap: 16px; align-items: start;
}
.bio-avatar { flex-shrink: 0; }
.bio-fields { display: flex; flex-direction: column; gap: 6px; }
.bio-name {
  font: 700 15px/1.3 var(--sans); color: #0d1f35; outline: none;
  min-height: 20px; padding: 2px 0;
}
.bio-role {
  font: 600 12px/1.3 var(--sans); color: #5a7a9a; letter-spacing: .04em; outline: none;
  min-height: 18px; padding: 2px 0;
}
.bio-desc {
  font: 400 13.5px/1.55 var(--sans); color: #4a6070; outline: none;
  min-height: 40px; padding: 4px 0;
}

/* ── INLINE FORMATTING TOOLBAR ───────────────────────────────── */
#ed-inline-tb {
  position: fixed; z-index: 99999;
  background: #0d1f35; border-radius: 9px;
  box-shadow: 0 6px 24px rgba(0,0,0,.35);
  padding: 5px 8px; display: none; align-items: center; gap: 2px;
  pointer-events: all;
}
#ed-inline-tb.show { display: flex; }
.itb-btn {
  width: 30px; height: 28px; border: none; background: none; cursor: pointer;
  color: rgba(255,255,255,.7); border-radius: 5px; font: 700 13px/1 var(--sans);
  display: flex; align-items: center; justify-content: center;
  transition: all .12s;
}
.itb-btn:hover { background: rgba(255,255,255,.15); color: #fff; }
.itb-sep { width: 1px; height: 18px; background: rgba(255,255,255,.18); margin: 0 4px; }

/* ── TOAST ────────────────────────────────────────────────────── */
#ed-toast {
  position: fixed; bottom: 24px; right: 24px; z-index: 99999;
  font: 600 13px/1.3 var(--sans);
  background: #0d1f35; color: #fff;
  padding: 12px 20px; border-radius: 10px;
  box-shadow: 0 4px 20px rgba(0,0,0,.25);
  transform: translateY(80px); opacity: 0;
  transition: transform .28s, opacity .28s;
  max-width: 320px;
}
#ed-toast.show { transform: translateY(0); opacity: 1; }
#ed-toast.ok   { border-left: 4px solid #34d399; }
#ed-toast.err  { border-left: 4px solid #f87171; }
#ed-toast.info { border-left: 4px solid #60a5fa; }

/* ── MISC ─────────────────────────────────────────────────────── */
/* Hide public site elements in editor */
#site-header-mount, #site-footer-mount, .article-share-sidebar,
.article-related, .article-right-aside { display: none !important; }
.article-layout { grid-template-columns: 1fr !important; }
[contenteditable] { -webkit-user-modify: read-write; }
  </style>
</head>
<body class="article-page">

<!-- ══ TOP TOOLBAR ══════════════════════════════════════════════ -->
<div id="ed-toolbar">
  <a href="admin.html#articles" class="tb-back">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Articles
  </a>
  <div class="tb-sep"></div>
  <div class="tb-slug-wrap">
    <span class="tb-label">Slug</span>
    <input type="text" id="ed-slug" placeholder="article-slug" />
  </div>
  <div class="tb-sep"></div>
  <span id="ed-status" class="tb-status draft">● Draft</span>
  <span id="ed-autosave"></span>
  <div class="tb-sep"></div>
  <button class="tb-btn tb-btn-preview" onclick="previewArticle()">Preview</button>
  <button class="tb-btn tb-btn-save" id="ed-save-btn" onclick="saveArticle()">Save Draft</button>
  <button class="tb-btn tb-btn-publish" id="ed-pub-btn" onclick="publishArticle()">Publish</button>
</div>

<!-- ══ INLINE TOOLBAR ═══════════════════════════════════════════ -->
<div id="ed-inline-tb">
  <button class="itb-btn" onmousedown="e(event,'bold')" title="Bold"><b>B</b></button>
  <button class="itb-btn" onmousedown="e(event,'italic')" title="Italic"><i>I</i></button>
  <button class="itb-btn" onmousedown="e(event,'underline')" title="Underline"><u>U</u></button>
  <div class="itb-sep"></div>
  <button class="itb-btn" onmousedown="insertLink(event)" title="Link">🔗</button>
  <div class="itb-sep"></div>
  <button class="itb-btn" onmousedown="e(event,'removeFormat')" title="Clear">✕</button>
</div>

<!-- ══ ARTICLE CANVAS ═══════════════════════════════════════════ -->
<div id="ed-canvas">

  <!-- HERO BAND -->
  <div id="ed-hero-band">

    <!-- Section Picker (preset only, no custom) -->
    <div class="ed-section-picker" id="ed-sec-picker">
      <div id="ed-section-pill" onclick="toggleSecDd(event)">
        <span id="ed-sec-label">Select Section</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="ed-section-dd" id="ed-sec-dd">
        <div class="ed-section-opt" onclick="setSection('Findings')">Findings</div>
        <div class="ed-section-opt" onclick="setSection('Culture')">Culture</div>
        <div class="ed-section-opt" onclick="setSection('Heritage')">Heritage</div>
        <div class="ed-section-opt" onclick="setSection('Community &amp; Heritage')">Community &amp; Heritage</div>
        <div class="ed-section-opt" onclick="setSection('Opinion')">Opinion</div>
        <div class="ed-section-opt" onclick="setSection('Archive')">Archive</div>
      </div>
    </div>

    <!-- Headline -->
    <h1 class="ed-headline" id="ed-headline"
        contenteditable="true"
        data-ed data-ph="Article headline..."
        spellcheck="true"></h1>

    <!-- Deck -->
    <p class="ed-deck" id="ed-deck"
       contenteditable="true"
       data-ed data-ph="Add a compelling subtitle..."></p>

    <!-- Meta -->
    <div class="ed-meta">
      <span>By <strong contenteditable="true" id="ed-author" data-ed data-ph="Author name" style="min-width:80px;display:inline-block;outline:none;"></strong></span>
      <span class="meta-dot">·</span>
      <span contenteditable="true" id="ed-date" data-ed data-ph="Date" style="outline:none;min-width:80px;display:inline-block;"></span>
      <span class="meta-dot">·</span>
      <span id="ed-readtime" style="color:#6b7f92;">— min read</span>
    </div>
  </div>

  <!-- BODY -->
  <div id="ed-body">

    <!-- Hero image -->
    <div id="ed-img-zone" onclick="triggerImgUpload()">
      <div class="img-zone-placeholder" id="ed-img-placeholder">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5-4 4-2-2-5 5"/></svg>
        <span>Click to upload hero image</span>
        <small>JPG, PNG, WebP · max 5MB</small>
      </div>
      <img id="ed-hero-img" src="" alt="" style="display:none;" />
      <button class="img-change-btn" onclick="triggerImgUpload();event.stopPropagation()">Change image</button>
    </div>
    <input type="file" id="ed-img-input" accept="image/*" style="display:none;" onchange="handleHeroUpload(this)" />

    <!-- Caption / credit -->
    <div class="ed-fig-caption">
      <div class="ed-fig-caption-text" contenteditable="true" id="ed-caption" data-ed data-ph="Caption text..."></div>
      <div class="ed-fig-credit" contenteditable="true" id="ed-credit" data-ed data-ph="Photo credit..."></div>
    </div>

    <!-- Article content -->
    <div id="ed-content" role="textbox" aria-multiline="true"></div>

    <!-- Add block controls -->
    <div id="ed-add-bar">
      <span>Insert</span>
      <button class="add-block-btn" onclick="addBlock('p')">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Paragraph
      </button>
      <button class="add-block-btn" onclick="addBlock('lead')">Lead</button>
      <button class="add-block-btn" onclick="addBlock('h2')">Heading</button>
      <button class="add-block-btn" onclick="addBlock('h3')">Sub-heading</button>
      <button class="add-block-btn" onclick="addBlock('blockquote')">Pull quote</button>
      <button class="add-block-btn" onclick="addBlock('figure')">Image</button>
      <button class="add-block-btn" onclick="addBlock('hr')">Divider</button>
    </div>
  </div>

  <!-- AUTHOR BIO -->
  <div id="ed-bio-card">
    <div class="bio-avatar">
      <svg width="52" height="52" viewBox="0 0 52 52" fill="none"><circle cx="26" cy="26" r="26" fill="#e8f1f9"/><circle cx="26" cy="20" r="9" fill="#0a528e" opacity=".3"/><ellipse cx="26" cy="42" rx="16" ry="9" fill="#0a528e" opacity=".18"/></svg>
    </div>
    <div class="bio-fields">
      <div class="bio-name" contenteditable="true" id="ed-bio-name" data-ed data-ph="Author Name"></div>
      <div class="bio-role" contenteditable="true" id="ed-bio-role" data-ed data-ph="Role · Publication"></div>
      <div class="bio-desc" contenteditable="true" id="ed-bio-desc" data-ed data-ph="Short author bio..."></div>
    </div>
  </div>

</div><!-- /ed-canvas -->

<div id="ed-toast"></div>

<script src="admin-auth.js"></script>
<script>
/* ══ ARTICLE EDITOR v2 ══════════════════════════════════════════
   Professional in-theme WYSIWYG editor for The Privatian Family
═══════════════════════════════════════════════════════════════ */

let _id     = null;
let _status = 'draft';
let _dirty  = false;
let _saving = false;

// ── Boot ───────────────────────────────────────────────────────
window.addEventListener('privatian:ready', () => {
  const p = new URLSearchParams(location.search);
  _id = p.get('id') || null;
  _id ? loadArticle(_id) : initEmpty();
  bindInlineTb();
  startAutoSave();
  document.addEventListener('input', () => { _dirty = true; updateReadTime(); });
  document.addEventListener('click', () => {
    document.getElementById('ed-sec-dd').classList.remove('open');
  });
  // date default
  if (!document.getElementById('ed-date').textContent.trim())
    document.getElementById('ed-date').textContent = fmtDate(new Date());
});

// ── Load ───────────────────────────────────────────────────────
async function loadArticle(id) {
  try {
    const r = await apiFetch('/api/articles?action=get&id=' + id);
    const a = await r.json();
    if (!r.ok) throw new Error(a.error);
    populate(a);
  } catch(e) { toast('Failed to load article', 'err'); }
}

function populate(a) {
  _id = a.id; _status = a.status || 'draft';
  set('ed-headline', a.title || '');
  set('ed-deck',     a.deck  || '');
  set('ed-author',   a.author || '');
  set('ed-date',     a.published_at
    ? fmtDate(new Date(a.published_at))
    : fmtDate(new Date(a.created_at || Date.now())));
  set('ed-bio-name', a.author      || '');
  set('ed-bio-role', a.author_role || '');
  set('ed-bio-desc', a.author_bio  || '');
  set('ed-caption',  a.hero_caption || '');
  set('ed-credit',   a.hero_credit  || '');
  document.getElementById('ed-slug').value = a.slug || '';
  if (a.section) setSection(a.section);
  if (a.hero_img_url) showHeroImg(a.hero_img_url);
  if (a.content_html) {
    document.getElementById('ed-content').innerHTML = a.content_html;
    document.querySelectorAll('#ed-content [data-block]').forEach(attachDel);
  } else {
    initEmpty();
  }
  updateStatus(); updateReadTime();
}

function initEmpty() {
  const c = document.getElementById('ed-content');
  if (!c.children.length) {
    addBlock('lead', true);
    addBlock('p', true);
  }
}

// ── Save ───────────────────────────────────────────────────────
async function saveArticle(silent = false) {
  if (_saving) return;
  _saving = true;
  const btn = document.getElementById('ed-save-btn');
  if (!silent) { btn.disabled = true; btn.textContent = 'Saving…'; }
  setAutosave('Saving…');

  const body = buildPayload();
  try {
    const r = await apiFetch('/api/articles?action=save', { method: 'POST', body: JSON.stringify(body) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Save failed');
    if (!_id) {
      _id = d.id;
      const u = new URL(location.href);
      u.searchParams.set('id', _id);
      history.replaceState({}, '', u.toString());
      document.getElementById('ed-slug').value = d.slug || '';
    }
    _dirty = false;
    setAutosave('Saved ' + new Date().toLocaleTimeString());
    if (!silent) toast('Draft saved', 'ok');
  } catch(e) {
    setAutosave('Save failed');
    if (!silent) toast(e.message || 'Save failed', 'err');
  } finally {
    _saving = false;
    if (!silent) { btn.disabled = false; btn.textContent = 'Save Draft'; }
  }
}

// ── Publish ────────────────────────────────────────────────────
async function publishArticle() {
  if (!_id) { await saveArticle(true); if (!_id) { toast('Save failed', 'err'); return; } }
  const btn = document.getElementById('ed-pub-btn');
  btn.disabled = true; btn.textContent = '…';
  try {
    const r = await apiFetch('/api/articles?action=publish&id=' + _id, { method: 'POST' });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Failed');
    _status = d.status;
    updateStatus();
    toast(_status === 'published' ? '🎉 Article published!' : 'Moved to draft', 'ok');
  } catch(e) { toast(e.message, 'err'); }
  finally { btn.disabled = false; updatePubBtn(); }
}

function buildPayload() {
  return {
    id:          _id,
    slug:        document.getElementById('ed-slug').value.trim() || undefined,
    title:       get('ed-headline'),
    deck:        get('ed-deck'),
    section:     document.getElementById('ed-sec-label').textContent.replace('Select Section','').trim(),
    author:      get('ed-author'),
    author_role: get('ed-bio-role'),
    author_bio:  get('ed-bio-desc'),
    hero_img_url: document.getElementById('ed-hero-img').src || '',
    hero_caption: get('ed-caption'),
    hero_credit:  get('ed-credit'),
    content_html: document.getElementById('ed-content').innerHTML,
  };
}

// Auto-save every 10s
function startAutoSave() {
  setInterval(() => { if (_dirty && !_saving) saveArticle(true); }, 10000);
}

// ── Image upload ───────────────────────────────────────────────
function triggerImgUpload() {
  document.getElementById('ed-img-input').click();
}

async function handleHeroUpload(input) {
  const f = input.files[0]; if (!f) return;
  showHeroImg(URL.createObjectURL(f));
  const form = new FormData(); form.append('file', f);
  try {
    const r = await fetch('/api/articles?action=upload', {
      method: 'POST', headers: { Authorization: 'Bearer ' + window.PRIVATIAN_TOKEN }, body: form
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Upload failed');
    showHeroImg(d.url); _dirty = true;
  } catch(e) { toast(e.message || 'Upload failed', 'err'); }
}

function showHeroImg(url) {
  const zone = document.getElementById('ed-img-zone');
  const img  = document.getElementById('ed-hero-img');
  const ph   = document.getElementById('ed-img-placeholder');
  zone.classList.add('has-image');
  ph.style.display = 'none';
  img.src = url; img.style.display = 'block';
}

// ── Blocks ─────────────────────────────────────────────────────
function addBlock(type, silent = false) {
  const c = document.getElementById('ed-content');
  let el;
  switch(type) {
    case 'p':
      el = mk('p'); el.className = 'article-p'; break;
    case 'lead':
      el = mk('p'); el.className = 'article-lead'; break;
    case 'h2':
      el = mk('h2'); break;
    case 'h3':
      el = mk('h3'); break;
    case 'blockquote':
      el = mk('blockquote');
      el.className = 'article-pullquote';
      el.innerHTML =
        '<p contenteditable="true" data-ed data-ph="\u201CQuote text here\u2026\u201D"></p>' +
        '<cite contenteditable="true" data-ed data-ph="\u2014 Attribution"></cite>';
      el.removeAttribute('contenteditable');
      break;
    case 'figure':
      el = document.createElement('figure');
      el.innerHTML =
        '<div class="ed-inline-img" onclick="this.querySelector(\'input\').click()" ' +
        'style="min-height:160px;background:#f2f5f8;border:2px dashed #c9d8e4;border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#7a9ab2;font:600 13px/1 var(--sans);gap:8px;">' +
        '<input type="file" accept="image/*" style="display:none" onchange="handleInlineImg(this)" />' +
        '<span>Click to add image</span></div>' +
        '<figcaption contenteditable="true" data-ed data-ph="Image caption…"></figcaption>';
      el.removeAttribute('contenteditable');
      break;
    case 'hr':
      el = document.createElement('hr');
      el.removeAttribute('contenteditable');
      break;
    default: return;
  }
  el.dataset.block = type;
  if (type !== 'blockquote' && type !== 'figure' && type !== 'hr') {
    el.contentEditable = 'true';
    el.dataset.ed = '';
    el.dataset.ph = type === 'h2' ? 'Section heading…' : type === 'h3' ? 'Sub-heading…' : type === 'lead' ? 'Opening paragraph…' : 'Write here…';
  }
  c.appendChild(el);
  attachDel(el);
  if (el.contentEditable === 'true') {
    el.focus();
    placeCaretEnd(el);
  }
}

function attachDel(el) {
  if (el.querySelector('.block-del')) return;
  if (el.tagName === 'HR') { el.style.position = 'relative'; }
  const btn = document.createElement('button');
  btn.className = 'block-del'; btn.innerHTML = '×'; btn.title = 'Delete';
  btn.onmousedown = ev => { ev.preventDefault(); el.remove(); _dirty = true; };
  el.appendChild(btn);
}

async function handleInlineImg(input) {
  const f = input.files[0]; if (!f) return;
  const zone = input.closest('.ed-inline-img');
  const img = document.createElement('img');
  img.src = URL.createObjectURL(f);
  zone.replaceWith(img);
  const form = new FormData(); form.append('file', f);
  try {
    const r = await fetch('/api/articles?action=upload', {
      method: 'POST', headers: { Authorization: 'Bearer ' + window.PRIVATIAN_TOKEN }, body: form
    });
    const d = await r.json();
    if (r.ok) { img.src = d.url; _dirty = true; }
  } catch(e) {}
}

// ── Section ────────────────────────────────────────────────────
function toggleSecDd(ev) {
  ev.stopPropagation();
  document.getElementById('ed-sec-dd').classList.toggle('open');
}
function setSection(val) {
  document.getElementById('ed-sec-label').textContent = val;
  document.querySelectorAll('.ed-section-opt').forEach(o => {
    o.classList.toggle('active', o.textContent.trim() === val);
  });
  document.getElementById('ed-sec-dd').classList.remove('open');
  _dirty = true;
}

// ── Inline toolbar ─────────────────────────────────────────────
function bindInlineTb() {
  const tb = document.getElementById('ed-inline-tb');
  document.addEventListener('selectionchange', () => {
    const sel = getSelection();
    if (!sel || sel.isCollapsed || !sel.toString().trim()) {
      tb.classList.remove('show'); return;
    }
    const node = sel.anchorNode;
    const ce = node?.nodeType === 3 ? node.parentElement.closest('[contenteditable]') : node?.closest?.('[contenteditable]');
    if (!ce) { tb.classList.remove('show'); return; }
    const r = sel.getRangeAt(0).getBoundingClientRect();
    tb.style.top  = (scrollY + r.top - 46) + 'px';
    tb.style.left = (scrollX + r.left + r.width / 2 - 80) + 'px';
    tb.classList.add('show');
  });
}

function e(ev, cmd) {
  ev.preventDefault();
  document.execCommand(cmd, false, null);
}
function insertLink(ev) {
  ev.preventDefault();
  const url = prompt('Enter URL:');
  if (url) document.execCommand('createLink', false, url);
}

// ── Keyboard shortcuts ─────────────────────────────────────────
document.addEventListener('keydown', ev => {
  if ((ev.ctrlKey || ev.metaKey) && ev.key === 's') { ev.preventDefault(); saveArticle(); }
  if ((ev.ctrlKey || ev.metaKey) && ev.key === 'k') { ev.preventDefault(); const u = prompt('Enter URL:'); if (u) document.execCommand('createLink', false, u); }
  if (ev.key === 'Enter' && ev.target.id === 'ed-headline') { ev.preventDefault(); document.getElementById('ed-deck').focus(); }
  if (ev.key === 'Enter' && ev.target.id === 'ed-deck') { ev.preventDefault(); document.getElementById('ed-author').focus(); }
});

// ── Status / UI helpers ────────────────────────────────────────
function updateStatus() {
  const badge = document.getElementById('ed-status');
  badge.className = 'tb-status ' + _status;
  badge.textContent = _status === 'published' ? '● Published' : '● Draft';
  updatePubBtn();
}
function updatePubBtn() {
  const btn = document.getElementById('ed-pub-btn');
  if (_status === 'published') {
    btn.textContent = 'Unpublish';
    btn.className = 'tb-btn tb-btn-unpublish';
  } else {
    btn.textContent = 'Publish';
    btn.className = 'tb-btn tb-btn-publish';
  }
}
function updateReadTime() {
  const html = document.getElementById('ed-content').innerHTML;
  const wc = html.replace(/<[^>]*>/g,' ').split(/\s+/).filter(Boolean).length;
  document.getElementById('ed-readtime').textContent = Math.max(1, Math.round(wc/200)) + ' min read';
}
function setAutosave(msg) {
  document.getElementById('ed-autosave').textContent = msg;
}
function previewArticle() {
  if (!_id) { toast('Save first to preview', 'info'); return; }
  window.open('/article.html?id=' + _id, '_blank');
}

// ── Toast ──────────────────────────────────────────────────────
function toast(msg, type = 'ok') {
  const t = document.getElementById('ed-toast');
  t.textContent = msg;
  t.className = 'show ' + type;
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 3000);
}

// ── Utils ──────────────────────────────────────────────────────
function get(id) { return (document.getElementById(id)?.textContent || '').trim(); }
function set(id, val) { const el = document.getElementById(id); if (el) el.textContent = val; }
function mk(tag) { return document.createElement(tag); }
function fmtDate(d) { return d.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}); }
function placeCaretEnd(el) {
  const r = document.createRange(); r.selectNodeContents(el); r.collapse(false);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
}
function apiFetch(url, opts = {}) {
  return fetch(url, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + window.PRIVATIAN_TOKEN, ...(opts.headers||{}) }
  });
}
</script>
