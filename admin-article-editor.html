<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Article Editor — The Privatian Family</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="article.css" />
  <style>
/* ─────────────────── RESET / BASE ─────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --navy:     #0a528e;
  --dark:     #0d1f35;
  --serif:    'Libre Baskerville', Georgia, serif;
  --sans:     'Source Sans 3', system-ui, sans-serif;
  --tb-h:     52px;
  --fmt-h:    44px;
  --col-w:    720px;
  --bg:       #f4f6f9;
  --card:     #ffffff;
  --border:   #e2e8f0;
  --text:     #1a2d3e;
  --muted:    #6b7f92;
  --light:    #8fa3b3;
}
html, body { min-height: 100%; }
body {
  font-family: var(--sans);
  background: var(--bg);
  padding-top: calc(var(--tb-h) + var(--fmt-h));
  color: var(--text);
}

/* ═══════════════ ADMIN TOOLBAR ═══════════════ */
#tb {
  position: fixed; top: 0; left: 0; right: 0;
  height: var(--tb-h); z-index: 1000;
  background: var(--dark);
  display: flex; align-items: center; gap: 10px;
  padding: 0 20px;
  box-shadow: 0 1px 0 rgba(255,255,255,.06), 0 4px 20px rgba(0,0,0,.35);
}
.tb-back {
  display: flex; align-items: center; gap: 7px;
  color: rgba(255,255,255,.55); text-decoration: none;
  font: 600 11.5px/1 var(--sans); letter-spacing: .04em;
  padding: 7px 12px; border-radius: 7px; transition: .15s; flex-shrink: 0;
}
.tb-back:hover { background: rgba(255,255,255,.09); color: #fff; }
.tb-vr { width: 1px; height: 24px; background: rgba(255,255,255,.1); flex-shrink: 0; }
.tb-slug-grp { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
.tb-lbl { font: 700 9.5px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: rgba(255,255,255,.3); flex-shrink: 0; }
#tb-slug {
  font: 400 12px/1 var(--sans); color: rgba(255,255,255,.65);
  background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
  border-radius: 5px; padding: 5px 10px; outline: none; width: 200px;
  transition: .15s;
}
#tb-slug:focus { border-color: rgba(255,255,255,.28); background: rgba(255,255,255,.1); color: #fff; }
.tb-badge {
  font: 700 9px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase;
  padding: 4px 10px; border-radius: 20px; flex-shrink: 0;
}
.tb-badge.draft     { background: rgba(251,191,36,.13); color: #fbbf24; }
.tb-badge.published { background: rgba(52,211,153,.13); color: #34d399; }
#tb-autosave { font: 400 10.5px/1 var(--sans); color: rgba(255,255,255,.25); flex-shrink: 0; min-width: 10ch; }
.tb-btn {
  font: 600 12px/1 var(--sans); border: none; border-radius: 7px;
  padding: 8px 15px; cursor: pointer; flex-shrink: 0; transition: .15s; white-space: nowrap;
}
.tb-preview { background: rgba(255,255,255,.07); color: rgba(255,255,255,.65); border: 1px solid rgba(255,255,255,.12); }
.tb-preview:hover { background: rgba(255,255,255,.14); color: #fff; }
.tb-save { background: rgba(10,82,142,.9); color: #fff; }
.tb-save:hover { background: #0a528e; }
.tb-save:disabled { opacity: .45; cursor: default; }
.tb-pub { background: #1a7a4a; color: #fff; }
.tb-pub:hover { background: #158040; }
.tb-unpub { background: rgba(220,38,38,.85); color: #fff; }
.tb-unpub:hover { background: #dc2626; }

/* ═══════════════ FORMAT BAR ═══════════════════ */
#fmt-bar {
  position: fixed; top: var(--tb-h); left: 0; right: 0;
  height: var(--fmt-h); z-index: 900;
  background: #fff;
  border-bottom: 1.5px solid var(--border);
  display: flex; align-items: center; gap: 2px;
  padding: 0 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,.06);
}
/* block format dropdown */
#fmt-block {
  font: 600 12px/1 var(--sans); color: var(--text);
  background: #f8fafc; border: 1px solid #dde4ea;
  border-radius: 6px; padding: 5px 10px; cursor: pointer; outline: none;
  margin-right: 6px;
  transition: .12s;
}
#fmt-block:hover { background: #eef2f7; }

.fmt-sep { width: 1px; height: 24px; background: #dde4ea; margin: 0 6px; }

/* format buttons */
.fb {
  width: 32px; height: 32px; border: none; border-radius: 6px;
  background: none; cursor: pointer; color: #4a5568;
  display: flex; align-items: center; justify-content: center;
  font: 600 13px/1 var(--sans); position: relative;
  transition: background .1s, color .1s;
}
.fb:hover { background: #eef2f7; color: var(--navy); }
.fb.active { background: #e8f1f9; color: var(--navy); }
.fb svg { pointer-events: none; }

/* color pickers */
.fb-color-wrap {
  position: relative; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
}
.fb-color-wrap input[type="color"] {
  position: absolute; opacity: 0; width: 100%; height: 100%; cursor: pointer; border: none;
}
.fb-color-wrap .color-ico {
  width: 32px; height: 32px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none; color: #4a5568; font: 700 14px/1 var(--sans); transition: background .1s;
}
.fb-color-wrap:hover .color-ico { background: #eef2f7; color: var(--navy); }

/* color swatch underneath letter */
.color-swatch { position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%); height: 3px; width: 18px; border-radius: 2px; }

/* ═══════════════ ARTICLE CANVAS ════════════════ */
#canvas {
  max-width: var(--col-w);
  margin: 28px auto;
  padding: 0;
}

/* HERO HEADER CARD */
#ed-header {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px 12px 0 0;
  padding: 40px 48px 32px;
  border-bottom: none;
}

/* Section picker */
.sec-picker { position: relative; display: inline-block; margin-bottom: 20px; }
#sec-pill {
  display: inline-flex; align-items: center; gap: 6px;
  font: 700 10.5px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase;
  color: #fff; background: var(--navy); padding: 5px 13px 5px 14px;
  border-radius: 3px; cursor: pointer; user-select: none; transition: opacity .15s;
}
#sec-pill:hover { opacity: .82; }
.sec-dd {
  display: none; position: absolute; top: calc(100% + 8px); left: 0; z-index: 300;
  background: #fff; border: 1px solid #dde4ea; border-radius: 10px;
  box-shadow: 0 10px 36px rgba(0,0,0,.14); min-width: 200px; overflow: hidden;
  animation: secFadeIn .12s ease;
}
@keyframes secFadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.sec-dd.open { display: block; }
.sec-opt {
  padding: 11px 18px; font: 600 13px/1 var(--sans); color: #374151;
  cursor: pointer; transition: background .1s;
}
.sec-opt:hover { background: #f0f5fa; color: var(--navy); }
.sec-opt.sel { background: #e8f1f9; color: var(--navy); }

/* Editable headline / deck */
.ed-h1 {
  font: 700 clamp(28px,4vw,44px)/1.17 var(--serif);
  color: var(--dark); letter-spacing: -.012em;
  outline: none; min-height: 1.2em; margin-bottom: 16px;
  word-break: break-word;
}
.ed-deck {
  font: 400 clamp(16px,2vw,20px)/1.55 var(--serif);
  color: #4a6070; font-style: italic;
  outline: none; min-height: 1.6em; margin-bottom: 24px;
  word-break: break-word;
}

/* Meta row */
.ed-meta {
  display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px;
  font: 400 13px/1.4 var(--sans); color: var(--muted);
  padding-top: 18px; border-top: 1px solid #e4ddd5;
}
.ed-meta .by { color: var(--text); }
.meta-sep { color: #c0ccd4; padding: 0 2px; }
/* Auto-sizing editables — INLINE so they naturally fit content */
.ed-inline {
  display: inline;
  outline: none;
  border-bottom: 1px dashed #c5d4de;
  padding-bottom: 1px;
  cursor: text;
  white-space: nowrap;
  min-width: 2ch;
  color: var(--text);
  font-weight: 600;
}
.ed-inline:focus { border-bottom-color: var(--navy); }
#ed-author { color: var(--dark); }
#ed-date   { color: var(--muted); font-weight: 400; }
#ed-readtime { color: var(--muted); }

/* ── BODY CARD ────────────────────────────────── */
#ed-body {
  background: var(--card);
  border: 1px solid var(--border);
  border-top: none; border-bottom: none;
  padding: 40px 48px;
}

/* RICH TEXT AREA */
#ed-rt {
  outline: none;
  font: 400 18.5px/1.78 var(--serif);
  color: #1a2d3e;
  min-height: 320px;
  caret-color: var(--navy);
  word-break: break-word;
}
/* Styling for formatted elements inside rich text */
#ed-rt p    { margin: 0 0 1.5em; }
#ed-rt h2   {
  font: 700 11.5px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase;
  color: var(--navy); margin: 2.5em 0 .9em; padding-top: 1.4em;
  border-top: 2px solid var(--navy);
}
#ed-rt h3   { font: 700 22px/1.3 var(--serif); color: var(--dark); margin: 2em 0 .7em; }
#ed-rt blockquote {
  margin: 2em 0; padding: 16px 24px;
  border-left: 4px solid var(--navy); background: #f0f5fa;
  border-radius: 0 8px 8px 0;
  font-style: italic; color: #3a5568;
}
#ed-rt blockquote p { margin: 0; }
#ed-rt a { color: var(--navy); text-decoration: underline; text-underline-offset: 3px; }
#ed-rt img { max-width: 100%; border-radius: 4px; display: block; margin: 1.8em auto; }
#ed-rt figure { margin: 2em 0; text-align: center; }
#ed-rt figure img { margin: 0 auto .6em; }
#ed-rt figcaption {
  font: 400 12px/1.5 var(--sans); color: var(--muted);
  border-top: 1px solid var(--border); padding-top: 8px; text-align: left;
}
#ed-rt hr { border: none; border-top: 2px solid #e4ddd5; margin: 2.5em 0; }
#ed-rt mark { background: #fff176; border-radius: 2px; padding: 0 2px; }
#ed-rt code { font-family: 'Courier New', monospace; background: #f1f5f9; padding: 2px 6px; border-radius: 4px; font-size: .88em; }

/* placeholder for rich text */
#ed-rt:empty::before {
  content: 'Begin writing your article here…\A\AUse the toolbar above to format text, add headings, quotes, or insert images anywhere.';
  white-space: pre; color: #b0c0cc; pointer-events: none;
  font-style: italic; font-size: 17px;
}

/* ── AUTHOR BIO CARD ─────────────────────────── */
#ed-bio {
  background: var(--card);
  border: 1px solid var(--border);
  border-top: 1px solid #f0f4f7;
  border-radius: 0 0 12px 12px;
  padding: 28px 48px 36px;
}
.bio-inner {
  display: grid; grid-template-columns: 56px 1fr; gap: 20px;
  align-items: start;
  background: #f7f9fb; border: 1px solid #e4eaf0; border-radius: 10px;
  padding: 20px 24px;
}
.bio-inner svg { flex-shrink: 0; }
.bio-fields { display: flex; flex-direction: column; gap: 6px; }
.bio-name, .bio-role, .bio-desc { outline: none; }
.bio-name {
  font: 700 15px/1.3 var(--sans); color: var(--dark);
  border-bottom: 1px dashed #c5d4de; padding-bottom: 3px; min-height: 20px;
}
.bio-name:focus { border-bottom-color: var(--navy); }
.bio-role {
  font: 600 12px/1.3 var(--sans); color: #5a7a9a; letter-spacing: .04em;
  border-bottom: 1px dashed #c5d4de; padding-bottom: 3px; min-height: 18px;
}
.bio-role:focus { border-bottom-color: var(--navy); }
.bio-desc {
  font: 400 13.5px/1.55 var(--sans); color: #4a6070; min-height: 44px;
  border-bottom: 1px dashed #c5d4de; padding-bottom: 4px;
}
.bio-desc:focus { border-bottom-color: var(--navy); }

/* ── FLOATING INLINE TOOLBAR ─────────────────── */
#sel-tb {
  position: fixed; z-index: 9999;
  background: var(--dark); border-radius: 9px;
  box-shadow: 0 6px 24px rgba(0,0,0,.4);
  padding: 5px 8px; display: none; align-items: center; gap: 2px;
  pointer-events: all;
  animation: tbFadeIn .12s ease;
}
@keyframes tbFadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
#sel-tb.show { display: flex; }
.stb { width: 28px; height: 26px; border: none; background: none; cursor: pointer; color: rgba(255,255,255,.7); border-radius: 5px; font: 700 12px/1 var(--sans); display: flex; align-items: center; justify-content: center; transition: .1s; }
.stb:hover { background: rgba(255,255,255,.14); color: #fff; }
.stb-vr { width: 1px; height: 16px; background: rgba(255,255,255,.18); margin: 0 3px; }

/* ── TOAST ───────────────────────────────────── */
#toast {
  position: fixed; bottom: 24px; right: 24px; z-index: 99999;
  font: 600 13px/1.3 var(--sans); background: var(--dark); color: #fff;
  padding: 12px 20px; border-radius: 10px; max-width: 320px;
  box-shadow: 0 4px 20px rgba(0,0,0,.25);
  transform: translateY(80px); opacity: 0;
  transition: transform .28s cubic-bezier(.34,1.56,.64,1), opacity .22s;
}
#toast.show { transform: translateY(0); opacity: 1; }
#toast.ok   { border-left: 4px solid #34d399; }
#toast.err  { border-left: 4px solid #f87171; }
#toast.info { border-left: 4px solid #60a5fa; }

/* Placeholder styles for all contenteditable */
[contenteditable][data-ph]:empty::before {
  content: attr(data-ph);
  color: #b0c0cc; pointer-events: none;
  font-weight: 400; font-style: italic;
}
.ed-h1[data-ph]:empty::before { font-style: normal; }

/* Hide public elements in editor mode */
#site-header-mount, #site-footer-mount, .article-share-sidebar,
.article-related, .article-right-aside { display: none !important; }
  </style>
</head>
<body>

<!-- ═══════════════════ ADMIN TOOLBAR ═══════════════════ -->
<div id="tb">
  <a href="admin.html#articles" class="tb-back">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Articles
  </a>
  <div class="tb-vr"></div>
  <div class="tb-slug-grp">
    <span class="tb-lbl">Slug</span>
    <input type="text" id="tb-slug" placeholder="article-slug-here" />
  </div>
  <div class="tb-vr"></div>
  <span class="tb-badge draft" id="tb-status">● Draft</span>
  <span id="tb-autosave"></span>
  <div class="tb-vr"></div>
  <button class="tb-btn tb-preview" onclick="previewArt()">Preview</button>
  <button class="tb-btn tb-save" id="tb-save-btn" onclick="saveArt()">Save Draft</button>
  <button class="tb-btn tb-pub" id="tb-pub-btn" onclick="pubArt()">Publish</button>
</div>

<!-- ═══════════════════ FORMAT BAR ═══════════════════════ -->
<div id="fmt-bar">

  <!-- Block format -->
  <select id="fmt-block" title="Block format" onchange="setBlock(this.value)">
    <option value="p">Paragraph</option>
    <option value="h2">Heading 2</option>
    <option value="h3">Heading 3</option>
    <option value="blockquote">Block Quote</option>
    <option value="pre">Code Block</option>
  </select>

  <div class="fmt-sep"></div>

  <!-- Text formatting -->
  <button class="fb" id="fb-bold"   onmousedown="fm(event,'bold')"          title="Bold (Ctrl+B)"><b>B</b></button>
  <button class="fb" id="fb-italic" onmousedown="fm(event,'italic')"        title="Italic (Ctrl+I)"><i>I</i></button>
  <button class="fb" id="fb-under"  onmousedown="fm(event,'underline')"     title="Underline (Ctrl+U)"><u>U</u></button>
  <button class="fb" id="fb-strike" onmousedown="fm(event,'strikeThrough')" title="Strikethrough"><s>S</s></button>

  <div class="fmt-sep"></div>

  <!-- Text color -->
  <div class="fb-color-wrap" title="Text color">
    <input type="color" id="fc-color" value="#000000" onchange="fm2('foreColor', this.value)" />
    <div class="color-ico">
      A
      <span class="color-swatch" id="swatch-color" style="background:#000000;"></span>
    </div>
  </div>

  <!-- Highlight color -->
  <div class="fb-color-wrap" title="Highlight">
    <input type="color" id="fc-hl" value="#ffff00" onchange="fm2('hiliteColor', this.value)" />
    <div class="color-ico" style="font-size:16px;">
      🖍
      <span class="color-swatch" id="swatch-hl" style="background:#ffff00;"></span>
    </div>
  </div>

  <div class="fmt-sep"></div>

  <!-- Link, unlink -->
  <button class="fb" onmousedown="insertLnk(event)" title="Insert link (Ctrl+K)">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
  </button>
  <button class="fb" onmousedown="fm(event,'unlink')" title="Remove link">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m18.84 12.25 1.72-1.71a4.5 4.5 0 0 0-6.37-6.37L12.5 5.86"/><path d="m5.17 11.75-1.72 1.71a4.5 4.5 0 0 0 6.37 6.37L11.5 18.14"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
  </button>

  <div class="fmt-sep"></div>

  <!-- Image insert -->
  <button class="fb" onmousedown="triggerImgInsert(event)" title="Insert image at cursor">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5-4 4-2-2-5 5"/></svg>
  </button>

  <!-- HR divider -->
  <button class="fb" onmousedown="insertHR(event)" title="Insert divider">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>

  <div class="fmt-sep"></div>

  <!-- Clear format -->
  <button class="fb" onmousedown="fm(event,'removeFormat')" title="Clear formatting">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m7 21 9-18"/><path d="M3 6h18M3 12h10M3 18h6"/></svg>
  </button>
</div>

<!-- Hidden file input for image insertion -->
<input type="file" id="img-insert-input" accept="image/*" style="display:none;" onchange="handleImgInsert(this)" />

<!-- ═══════════════════ ARTICLE CANVAS ════════════════════ -->
<div id="canvas">

  <!-- HEADER -->
  <div id="ed-header">

    <!-- Section picker -->
    <div class="sec-picker" id="sec-picker">
      <div id="sec-pill" onclick="toggleSecDd(event)">
        <span id="sec-label">Select Section</span>
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="sec-dd" id="sec-dd">
        <div class="sec-opt" onclick="setSec('Findings')">Findings</div>
        <div class="sec-opt" onclick="setSec('Culture')">Culture</div>
        <div class="sec-opt" onclick="setSec('Heritage')">Heritage</div>
        <div class="sec-opt" onclick="setSec('Community &amp; Heritage')">Community &amp; Heritage</div>
        <div class="sec-opt" onclick="setSec('Opinion')">Opinion</div>
        <div class="sec-opt" onclick="setSec('Archive')">Archive</div>
      </div>
    </div>

    <!-- Headline -->
    <h1 class="ed-h1"
        id="ed-headline"
        contenteditable="true"
        data-ph="Article headline…"
        spellcheck="true"></h1>

    <!-- Deck -->
    <p class="ed-deck"
       id="ed-deck"
       contenteditable="true"
       data-ph="Add a compelling subtitle…"></p>

    <!-- Meta — all inline auto-size -->
    <div class="ed-meta">
      <span class="by">By</span>
      <span class="ed-inline" id="ed-author" contenteditable="true" data-ph="Author name"></span>
      <span class="meta-sep">·</span>
      <span class="ed-inline" id="ed-date"   contenteditable="true" data-ph="Date"        ></span>
      <span class="meta-sep">·</span>
      <span id="ed-readtime">— min read</span>
    </div>
  </div>

  <!-- BODY -->
  <div id="ed-body">
    <!-- THE SINGLE RICH TEXT BODY -->
    <div id="ed-rt"
         contenteditable="true"
         spellcheck="true"
         role="textbox"
         aria-multiline="true"
         aria-label="Article body"></div>
  </div>

  <!-- AUTHOR BIO -->
  <div id="ed-bio">
    <div class="bio-inner">
      <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
        <circle cx="28" cy="28" r="28" fill="#e8f1f9"/>
        <circle cx="28" cy="21" r="9" fill="#0a528e" opacity=".28"/>
        <ellipse cx="28" cy="45" rx="17" ry="9" fill="#0a528e" opacity=".16"/>
      </svg>
      <div class="bio-fields">
        <div class="bio-name" contenteditable="true" id="bio-name" data-ph="Author Name"></div>
        <div class="bio-role" contenteditable="true" id="bio-role" data-ph="Role · Designation"></div>
        <div class="bio-desc" contenteditable="true" id="bio-desc" data-ph="A short bio about the author…"></div>
      </div>
    </div>
  </div>

</div><!-- /canvas -->

<!-- Floating selection toolbar -->
<div id="sel-tb">
  <button class="stb" onmousedown="fm(event,'bold')"><b>B</b></button>
  <button class="stb" onmousedown="fm(event,'italic')"><i>I</i></button>
  <button class="stb" onmousedown="fm(event,'underline')"><u>U</u></button>
  <div class="stb-vr"></div>
  <button class="stb" onmousedown="insertLnk(event)">🔗</button>
  <div class="stb-vr"></div>
  <button class="stb" onmousedown="fm(event,'removeFormat')" title="Clear">✕</button>
</div>

<div id="toast"></div>

<script src="admin-auth.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════
   THE PRIVATIAN FAMILY — Article Editor v3
   Professional single-body rich text editor
══════════════════════════════════════════════════════════════ */

let ART_ID   = null;
let STATUS   = 'draft';
let DIRTY    = false;
let SAVING   = false;
let _savedSel = null; // saved selection for image insertion

// ── INIT ────────────────────────────────────────────────────
window.addEventListener('privatian:ready', () => {
  ART_ID = new URLSearchParams(location.search).get('id');
  ART_ID ? loadArticle(ART_ID) : initEmpty();

  setupSelToolbar();
  setupFormatBarSync();
  startAutoSave();
  document.addEventListener('input', onInput);
  document.addEventListener('click', e => {
    if (!document.getElementById('sec-picker').contains(e.target))
      document.getElementById('sec-dd').classList.remove('open');
  });
  if (!g('ed-date').textContent.trim())
    g('ed-date').textContent = fmtDate(new Date());
});

function initEmpty() {
  const rt = g('ed-rt');
  if (!rt.innerHTML.trim()) rt.focus();
}

// ── LOAD ────────────────────────────────────────────────────
async function loadArticle(id) {
  try {
    const r = await api('/api/articles?action=get&id=' + id);
    const a = await r.json();
    if (!r.ok) throw new Error(a.error);
    fill(a);
  } catch(e) { showToast('Failed to load: ' + e.message, 'err'); }
}

function fill(a) {
  ART_ID = a.id; STATUS = a.status || 'draft';
  txt('ed-headline', a.title || '');
  txt('ed-deck',     a.deck  || '');
  txt('ed-author',   a.author      || '');
  txt('ed-date',     a.published_at
    ? fmtDate(new Date(a.published_at))
    : fmtDate(new Date(a.created_at || Date.now())));
  txt('bio-name',    a.author      || '');
  txt('bio-role',    a.author_role || '');
  txt('bio-desc',    a.author_bio  || '');
  g('tb-slug').value = a.slug || '';
  if (a.section) setSec(a.section);
  if (a.content_html) g('ed-rt').innerHTML = a.content_html;
  refreshStatus(); updateReadTime();
}

// ── SAVE (DRAFT) ─────────────────────────────────────────────
async function saveArt(silent = false) {
  if (SAVING) return;
  SAVING = true;
  const btn = g('tb-save-btn');
  if (!silent) { btn.disabled = true; btn.textContent = 'Saving…'; }
  setAutosave('Saving…');

  try {
    const r = await api('/api/articles?action=save', { method: 'POST', body: JSON.stringify(buildPayload()) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Save failed');
    if (!ART_ID) {
      ART_ID = d.id;
      const u = new URL(location.href); u.searchParams.set('id', ART_ID);
      history.replaceState({}, '', u.toString());
      g('tb-slug').value = d.slug || '';
    }
    DIRTY = false;
    setAutosave('Saved ' + new Date().toLocaleTimeString());
    if (!silent) showToast('Draft saved ✓', 'ok');
  } catch(e) {
    setAutosave('Save failed!');
    if (!silent) showToast(e.message || 'Save failed', 'err');
  } finally {
    SAVING = false;
    if (!silent) { btn.disabled = false; btn.textContent = 'Save Draft'; }
  }
}

// ── PUBLISH / UNPUBLISH ──────────────────────────────────────
async function pubArt() {
  if (!ART_ID) { await saveArt(true); if (!ART_ID) { showToast('Save failed', 'err'); return; } }
  const btn = g('tb-pub-btn'); btn.disabled = true; btn.textContent = '…';
  try {
    const r = await api('/api/articles?action=publish&id=' + ART_ID, { method: 'POST' });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Failed');
    STATUS = d.status;
    refreshStatus();
    showToast(STATUS === 'published' ? '🎉 Article published!' : 'Moved to Draft', 'ok');
  } catch(e) { showToast(e.message, 'err'); }
  finally { btn.disabled = false; refreshPubBtn(); }
}

function buildPayload() {
  return {
    id:           ART_ID,
    slug:         g('tb-slug').value.trim() || undefined,
    title:        gt('ed-headline'),
    deck:         gt('ed-deck'),
    section:      g('sec-label').textContent === 'Select Section' ? '' : g('sec-label').textContent,
    author:       gt('ed-author'),
    author_role:  gt('bio-role'),
    author_bio:   gt('bio-desc'),
    hero_img_url: '',
    hero_caption: '',
    hero_credit:  '',
    content_html: g('ed-rt').innerHTML,
  };
}

// ── AUTO SAVE ─────────────────────────────────────────────────
function startAutoSave() {
  setInterval(() => { if (DIRTY && !SAVING) saveArt(true); }, 10000);
}
function onInput() { DIRTY = true; updateReadTime(); }

// ── FORMATTING ────────────────────────────────────────────────
function fm(ev, cmd, val) {
  ev.preventDefault();
  document.execCommand(cmd, false, val || null);
  g('ed-rt').focus();
  syncFmtBar();
}
function fm2(cmd, val) {
  document.execCommand(cmd, false, val);
  // update swatch
  if (cmd === 'foreColor') g('swatch-color').style.background = val;
  if (cmd === 'hiliteColor') g('swatch-hl').style.background = val;
  g('ed-rt').focus();
}

function setBlock(tag) {
  g('ed-rt').focus();
  if (tag === 'blockquote' || tag === 'pre') {
    document.execCommand('formatBlock', false, tag);
  } else {
    document.execCommand('formatBlock', false, tag);
  }
  syncFmtBar();
}

function insertLnk(ev) {
  ev?.preventDefault();
  const sel = getSelection().toString();
  if (!sel) { showToast('Select text first', 'info'); return; }
  const url = prompt('URL:');
  if (url) document.execCommand('createLink', false, url);
}

function insertHR(ev) {
  ev.preventDefault();
  g('ed-rt').focus();
  document.execCommand('insertHTML', false, '<hr/>');
}

// ── IMAGE INSERT AT CURSOR ─────────────────────────────────────
function triggerImgInsert(ev) {
  ev.preventDefault();
  // Save the current selection/cursor position
  const sel = getSelection();
  if (sel.rangeCount) _savedSel = sel.getRangeAt(0).cloneRange();
  g('img-insert-input').value = '';
  g('img-insert-input').click();
}

async function handleImgInsert(input) {
  const file = input.files[0]; if (!file) return;
  const localUrl = URL.createObjectURL(file);
  insertImgHtml(localUrl);
  // Upload to server
  const form = new FormData(); form.append('file', file);
  try {
    const r = await fetch('/api/articles?action=upload', {
      method: 'POST', headers: { Authorization: 'Bearer ' + window.PRIVATIAN_TOKEN }, body: form
    });
    const d = await r.json();
    if (r.ok) {
      // Replace the blob URL with the real URL
      g('ed-rt').querySelectorAll('img').forEach(img => {
        if (img.src === localUrl) img.src = d.url;
      });
      DIRTY = true;
    }
  } catch(e) { showToast('Upload failed', 'err'); }
}

function insertImgHtml(url) {
  g('ed-rt').focus();
  // Restore saved selection
  if (_savedSel) {
    const sel = getSelection();
    sel.removeAllRanges(); sel.addRange(_savedSel);
  }
  const html = `<figure><img src="${url}" alt="" /><figcaption contenteditable="true" data-ph="Add caption…"></figcaption></figure><p><br></p>`;
  document.execCommand('insertHTML', false, html);
}

// ── SECTION PICKER ────────────────────────────────────────────
function toggleSecDd(ev) {
  ev.stopPropagation();
  g('sec-dd').classList.toggle('open');
}
function setSec(val) {
  g('sec-label').textContent = val;
  document.querySelectorAll('.sec-opt').forEach(o => o.classList.toggle('sel', o.textContent.trim() === val));
  g('sec-dd').classList.remove('open');
  DIRTY = true;
}

// ── FORMAT BAR SYNC (bold/italic state) ──────────────────────
function setupFormatBarSync() {
  document.addEventListener('selectionchange', syncFmtBar);
}
function syncFmtBar() {
  const cmds = ['bold','italic','underline','strikeThrough'];
  const ids  = ['fb-bold','fb-italic','fb-under','fb-strike'];
  cmds.forEach((c,i) => {
    const el = document.getElementById(ids[i]);
    if (el) el.classList.toggle('active', document.queryCommandState(c));
  });
  // Sync block dropdown
  const block = document.getElementById('fmt-block');
  if (block) {
    try {
      const val = document.queryCommandValue('formatBlock').toLowerCase().replace(/[<>]/g,'');
      const opts = { p: 'p', h2: 'h2', h3: 'h3', blockquote: 'blockquote', pre: 'pre' };
      block.value = opts[val] || 'p';
    } catch(e) {}
  }
}

// ── SELECTION TOOLBAR (float on text select) ──────────────────
function setupSelToolbar() {
  const tb = g('sel-tb');
  document.addEventListener('selectionchange', () => {
    const sel = getSelection();
    if (!sel || sel.isCollapsed || !sel.toString().trim()) {
      tb.classList.remove('show'); return;
    }
    const anc = sel.anchorNode;
    const ce = anc?.nodeType === 3 ? anc.parentElement?.closest('[contenteditable]') : anc?.closest?.('[contenteditable]');
    if (!ce || ce.id === 'tb-slug') { tb.classList.remove('show'); return; }
    const r = sel.getRangeAt(0).getBoundingClientRect();
    tb.style.top  = (scrollY + r.top  - 44) + 'px';
    tb.style.left = (scrollX + r.left + r.width/2 - 80) + 'px';
    tb.classList.add('show');
  });
}

// ── READ TIME ─────────────────────────────────────────────────
function updateReadTime() {
  const words = g('ed-rt').innerText.replace(/\s+/g,' ').split(' ').filter(Boolean).length;
  g('ed-readtime').textContent = Math.max(1, Math.round(words/200)) + ' min read';
}

// ── STATUS ────────────────────────────────────────────────────
function refreshStatus() {
  const b = g('tb-status');
  b.className = 'tb-badge ' + STATUS;
  b.textContent = STATUS === 'published' ? '● Published' : '● Draft';
  refreshPubBtn();
}
function refreshPubBtn() {
  const btn = g('tb-pub-btn');
  if (STATUS === 'published') {
    btn.textContent = 'Unpublish'; btn.className = 'tb-btn tb-unpub';
  } else {
    btn.textContent = 'Publish'; btn.className = 'tb-btn tb-pub';
  }
}
function setAutosave(msg) { g('tb-autosave').textContent = msg; }

function previewArt() {
  if (!ART_ID) { showToast('Save first to preview', 'info'); return; }
  window.open('/article.html?id=' + ART_ID, '_blank');
}

// ── KEYBOARD ──────────────────────────────────────────────────
document.addEventListener('keydown', ev => {
  const cm = ev.ctrlKey || ev.metaKey;
  if (cm && ev.key === 's') { ev.preventDefault(); saveArt(); }
  if (cm && ev.key === 'k') { ev.preventDefault(); insertLnk(); }
  // Enter on headline → focus deck
  if (ev.key === 'Enter' && ev.target.id === 'ed-headline') { ev.preventDefault(); g('ed-deck').focus(); }
  if (ev.key === 'Enter' && ev.target.id === 'ed-deck')     { ev.preventDefault(); g('ed-rt').focus(); placeCaretEnd(g('ed-rt')); }
});

// ── UTILS ─────────────────────────────────────────────────────
function g(id)      { return document.getElementById(id); }
function gt(id)     { return (g(id)?.textContent || '').trim(); }
function txt(id, v) { const el = g(id); if (el) el.textContent = v; }
function fmtDate(d) { return d.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}); }
function placeCaretEnd(el) {
  const r = document.createRange(); r.selectNodeContents(el); r.collapse(false);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
}
function api(url, opts = {}) {
  return fetch(url, { ...opts, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + window.PRIVATIAN_TOKEN, ...(opts.headers||{}) } });
}
function showToast(msg, type = 'ok') {
  const t = g('toast');
  t.textContent = msg; t.className = 'show ' + type;
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 3000);
}
</script>
</body>
</html>
