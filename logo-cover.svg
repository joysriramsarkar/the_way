<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1f1015"/>
      <stop offset="50%" stop-color="#0e1118"/>
      <stop offset="100%" stop-color="#07090d"/>
    </radialGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff334b"/>
      <stop offset="50%" stop-color="#c2182b"/>
      <stop offset="100%" stop-color="#7a0916"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle Revolutionary Grid / Rays -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="0" x2="1200" y2="630"/>
    <line x1="1200" y1="0" x2="0" y2="630"/>
    <circle cx="600" cy="315" r="250"/>
    <circle cx="600" cy="315" r="450"/>
  </g>

  <!-- Large Central Emblem -->
  <g transform="translate(540, 100)">
    <polygon points="60,4 116,60 60,116 4,60" fill="#111827" stroke="url(#crimsonGrad)" stroke-width="4"/>
    <!-- Flame -->
    <path d="M60 22 C66 34, 76 40, 70 54 C66 62, 58 64, 54 74 C52 78, 52 84, 60 90 C48 86, 42 74, 44 64 C46 52, 56 46, 54 34 C56 30, 58 26, 60 22 Z" fill="url(#crimsonGrad)"/>
    <path d="M60 38 C64 46, 68 50, 64 58 C62 62, 58 66, 58 74 C56 68, 54 62, 56 56 C58 48, 60 44, 60 38 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Main Title -->
  <text x="600" y="295" text-anchor="middle" font-family="'Hind Siliguri', 'Noto Serif Bengali', 'Anek Bangla', sans-serif" font-size="76" font-weight="900" fill="#ffffff" letter-spacing="2">
    দ্য <tspan fill="url(#crimsonGrad)">ওয়ে</tspan>
  </text>
  
  <text x="600" y="360" text-anchor="middle" font-family="'Playfair Display', 'Cinzel', serif" font-size="36" font-weight="900" fill="#f3f4f6" letter-spacing="12">
    THE WAY
  </text>

  <!-- Divider Line with Star -->
  <line x1="420" y1="400" x2="560" y2="400" stroke="#4b5563" stroke-width="1.5"/>
  <polygon points="600,390 603,398 612,398 605,403 607,411 600,406 593,411 595,403 588,398 597,398" fill="url(#goldGrad)"/>
  <line x1="640" y1="400" x2="780" y2="400" stroke="#4b5563" stroke-width="1.5"/>

  <!-- Subtitle & Motto -->
  <text x="600" y="450" text-anchor="middle" font-family="'Hind Siliguri', sans-serif" font-size="24" font-weight="600" fill="url(#goldGrad)" letter-spacing="1">
    আন্তর্জাতিক সমাজতান্ত্রিক চিন্তন ও গণআন্দোলনের উন্মুক্ত পোর্টাল
  </text>
  
  <text x="600" y="495" text-anchor="middle" font-family="'Inter', sans-serif" font-size="16" font-weight="500" fill="#9ca3af" letter-spacing="3">
    A MULTILINGUAL PLATFORM BEYOND CAPITAL, EMPIRE &amp; EXPLOITATION
  </text>

  <text x="600" y="555" text-anchor="middle" font-family="'Hind Siliguri', sans-serif" font-size="18" font-weight="700" fill="#e52b3c" letter-spacing="1.5">
    “জগতের সকল শোষিত মানুষ এক হও!”
  </text>
</svg>
