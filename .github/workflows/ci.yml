name: CI & Code Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validate Code & Data Integrity
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Type Check Backend & API Handlers (TypeScript)
      run: npm run type-check

    - name: Validate All Web Books JSON Data
      run: |
        node -e "
          const fs = require('fs');
          const path = require('path');
          const booksDir = path.join(__dirname, 'public', 'assets', 'js', 'books');
          const files = fs.readdirSync(booksDir).filter(f => f.endsWith('.json'));
          console.log('Validating ' + files.length + ' book JSON files...');
          let hasError = false;
          for (const file of files) {
            const filePath = path.join(booksDir, file);
            try {
              const content = fs.readFileSync(filePath, 'utf8');
              const parsed = JSON.parse(content);
              if (!Array.isArray(parsed)) {
                console.error('❌ ' + file + ' is not a valid JSON array');
                hasError = true;
              } else {
                console.log('✅ ' + file + ' (' + parsed.length + ' chapters/parts)');
              }
            } catch (err) {
              console.error('❌ ' + file + ' JSON parse error: ' + err.message);
              hasError = true;
            }
          }
          if (hasError) process.exit(1);
          console.log('All book data files validated successfully!');
        "

    - name: Verify Frontend JavaScript Syntax
      run: |
        node --check public/assets/js/supabase-config.js
        node --check public/assets/js/books-data.js
        node --check public/assets/js/components.js
        node --check public/assets/js/script.js
        node --check public/assets/js/i18n.js
        node --check public/assets/js/admin.js
        node --check public/assets/js/admin-auth.js

    - name: Run Test Suite
      run: npm test

    - name: Test Local Server Boot
      run: |
        node -e "
          const http = require('http');
          const { exec } = require('child_process');
          console.log('Testing server bootstrap...');
          const serverProc = exec('npx tsx dev-server.ts', {
            env: { ...process.env, PORT: '3999', SESSION_SECRET: 'test_secret_for_ci_12345678901234' }
          });
          setTimeout(() => {
            http.get('http://localhost:3999', (res) => {
              console.log('Server responded with HTTP code:', res.statusCode);
              serverProc.kill();
              if (res.statusCode === 200) {
                console.log('✅ Local server bootstrap verified!');
                process.exit(0);
              } else {
                console.error('❌ Unexpected status code:', res.statusCode);
                process.exit(1);
              }
            }).on('error', (e) => {
              console.error('❌ Server connection error:', e.message);
              serverProc.kill();
              process.exit(1);
            });
          }, 3500);
        "
